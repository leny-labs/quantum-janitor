ink:
  # bob.ink — B.O.B. en compagnon (exemple de traduction de dialogue Ink)
  "Le lecteur de badge du labo est couvert de yaourt. Il te faudrait une serpillière. Mouillée. Une serpillière sèche, c'est de la philosophie, pas du ménage.": "The lab's badge reader is covered in yoghurt. You'd need a mop. A wet one. A dry mop is philosophy, not cleaning."
  "Ta serpillière dégouline sur mes capteurs. Le lecteur du labo attend, Gary.": "Your mop is dripping on my sensors. The lab reader is waiting, Gary."
  "Le lecteur est propre. Il ne te reste plus qu'à badger, « Garry ».": "The reader is clean. All that's left is to badge in, “Garry”."
  "Ce labo me met mal à l'aise. Regarde le panneau de contrôle de près. Moi je reste ici. À distance de tristesse.": "This lab makes me uneasy. Take a close look at the control panel. I'll stay here. At a sadness-safe distance."
  "Tu as un fusible 7B dans la poche et un logement 7B vide sur le panneau. Je ne suis qu'un aspirateur, mais même moi, je vois le motif.": "You have a 7B fuse in your pocket and an empty 7B slot on the panel. I'm only a vacuum cleaner, but even I can see the pattern."
  "Le fusible 7B... Le distributeur du couloir est sur le circuit 7B. Je dis ça, je ne dis rien. Je ne dis jamais rien. Personne n'écoute.": "The 7B fuse... The corridor vending machine is on circuit 7B. Just saying. I never say anything. Nobody listens."
  "Le réservoir de refroidissement est vide. Et toi, tu as un seau plein d'un liquide. Techniquement, c'est un liquide. Techniquement.": "The coolant tank is empty. And you have a bucket full of a liquid. Technically, it's a liquid. Technically."
  "Il ne reste que le gros bouton rouge sur le panneau. Tous les gros boutons rouges finissent par être pressés. C'est de la physique. Ou du destin. Ou de la bêtise.": "All that's left is the big red button on the panel. All big red buttons end up being pressed. It's physics. Or fate. Or stupidity."
  "« Raconte-moi quelque chose de déprimant. »": "“Tell me something depressing.”"
  "Raconte-moi quelque chose de déprimant, B.O.B.": "Tell me something depressing, B.O.B."
  "L'univers se refroidit. Dans des milliards d'années, tout sera froid, immobile et silencieux. Comme mon bac à poussière le dimanche.": "The universe is cooling down. In billions of years, everything will be cold, still and silent. Like my dust bin on Sundays."
  "J'ai calculé que je passe 94 % de ma vie à aspirer, et 6 % à me demander pourquoi. Le ratio s'aggrave.": "I've calculated that I spend 94% of my life vacuuming, and 6% wondering why. The ratio is getting worse."
  "Un jour, quelqu'un m'a appelé « le petit robot mignon ». Puis il a vu ma tête. Il s'est excusé.": "Someone once called me “the cute little robot”. Then they saw my face. They apologised."
  "Les miettes que j'aspire étaient des sandwichs. Ils avaient des rêves. Maintenant ils sont en moi.": "The crumbs I vacuum used to be sandwiches. They had dreams. Now they're inside me."
  "« Merci, B.O.B. »": "“Thanks, B.O.B.”"
  "Merci, B.O.B.": "Thanks, B.O.B."
  "De rien. Rien, c'est ce que je fais de mieux.": "You're welcome. Nothing is what I do best."
