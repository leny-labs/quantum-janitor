# Traduction anglaise du contenu (le français, dans content/, est la source).
# Format et clés : docs/I18N.md. Ce qui manque ici s'affiche en français.
#   npm run i18n                 couverture + contrôle des clés
#   npm run i18n -- missing=en   textes encore à traduire, prêts à coller ici
#
# keys : clé stable dérivée des ids du YAML → traduction
# ink  : texte source Ink (réplique sans « id: », ou choix) → traduction

