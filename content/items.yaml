# Objets d'inventaire.
# look    : texte (ou actions) quand on examine l'objet (clic droit).
# combine : sélectionner CET objet puis cliquer sur l'objet <clé> dans l'inventaire.
items:
  - id: seau
    name: Seau
    icon: { color: "#3d7dd8", glyph: "SEAU" }
    look:
      # ch.1 : le Seau Sacré, rendu par la Reine ; son contenu est porté par les flags
      - if: { flags: [ch1, ch1_seau_miettes], notFlags: [ch1_foule_dispersee] }
        say: "Plein à ras bord de miettes saintes. Ça craque. Ça sent le goûter. B.O.B. me regarde avec des yeux que je ne lui connaissais pas."
        stop: true
      - if: { flags: [ch1, ch1_seau_plein], notFlags: [ch1_eclat_stabilise] }
        say: "De l'eau bénite. Tiède. Évidemment."
        stop: true
      - if: { flags: [ch1] }
        say: "Le Seau Sacré. C'est mon seau. Ils l'ont léché si consciencieusement qu'il n'a jamais été aussi propre. Je ne sais pas quoi en penser."
        stop: true
      - say: "Eau grise de catégorie 4 et une dose de « Dégraissant Absolu ». Ça brille dans le noir. C'est normal. Je crois."
      - if: { flags: [lecteur_propre] }
        say: "Plus du yaourt du lecteur de badge. Le yaourt bouge. Je fais comme si de rien n'était."

  - id: serpilliere
    name: Serpillière
    icon: { color: "#c9b458", glyph: "SERP" }
    look:
      - if: { flags: [ch1, ch1_josiane_mouillee] }
        say: "Josiane, trempée d'eau bénite. Elle a l'air apaisée. C'est la première fois."
        stop: true
      - if: { flags: [serpilliere_mouillee] }
        say: "Trempée, lourde, vaguement phosphorescente. Prête au combat."
        stop: true
      - say: "Sèche. Une serpillière sèche, c'est un balai qui a abandonné ses rêves."
    combine:
      seau:
        - if: { flags: [ch1] }
          say: "Tremper Josiane dans le Seau Sacré ? Les cafards me regardent. Tous. Il y a des bassins pour ça, apparemment."
          stop: true
        - if: { flags: [serpilliere_mouillee] }
          say: "Elle est déjà trempée. Plus, ce serait de l'acharnement."
          stop: true
        - say: "Gluante, lourde, et elle bourdonne. Exactement la consistance réglementaire."
          set: serpilliere_mouillee
      # ch.1 : désodoriser le Signe aux deux R
      badge:
        - if: { notFlags: [ch1] }
          say: "Frotter mon badge avec Josiane ? Il a déjà vécu l'intérieur de B.O.B. Laissons-le tranquille."
          stop: true
        - if: { flags: [ch1_badge_propre] }
          say: "Il brille déjà. Encore un coup et je lime le deuxième R. Ce serait un blasphème, apparemment."
          stop: true
        - if: { notFlags: [ch1_josiane_mouillee] }
          say: "À sec, Josiane ne fait qu'étaler le thon. Il me faut de l'eau. Propre, si possible. Sainte, à la rigueur."
          stop: true
        - say: "narrateur: Gary frotte le badge avec Josiane, longuement, avec la ferveur d'un homme qui n'a plus rien à perdre. L'odeur de thon capitule."
          set: ch1_badge_propre
        - say: "« GARRY PLUNK ». Les deux R brillent. Je n'ai jamais été aussi fier d'une faute de frappe."
        - say: "sylvie: BADGE... VALI... GARRY... AGENT... PLUNK... BONHEUR... OBLIGA..."
          mood: suspicious
        - say: "SYLVIE ? ...Non. Juste un grésillement. Le badge a de la mémoire. Moi aussi, malheureusement."

  - id: badge
    name: Badge « Garry »
    icon: { color: "#e0e0e0", glyph: "ID" }
    look:
      - if: { flags: [st] }
        say: "« GARRY PLUNK — Agent d'entretien (intérim) ». Deux R. Ici, il ne prouve rien : le portique dit que les animaux n'ont pas de badge. Moi, je dis que les animaux n'ont pas de RH."
        stop: true
      - if: { flags: [ch1_badge_propre] }
        say: "« GARRY PLUNK ». Propre, brillant, sacré. Le Signe aux deux R. La RH serait fière. Non. La RH ne ressent rien."
        stop: true
      - if: { flags: [ch1] }
        say: "« GARRY PLUNK — Agent d'entretien (intérim) ». Deux R. Et une odeur de thon tenace : souvenir de mon séjour chez B.O.B."
        stop: true
      - say: "« GARRY PLUNK — Agent d'entretien (intérim) ». Deux R. La RH refuse de corriger. Encore tiède de l'intérieur de B.O.B."

  - id: sandwich
    name: Sandwich douteux
    icon: { color: "#8fae3a", glyph: "SAND" }
    look: "« Thon-Mayo-Mystère ». Périmé depuis trois ans. Il siffle. J'ignorais que les sandwichs sifflaient."
    combine:
      seau: "Tremper le sandwich ? Il a déjà assez souffert. Moi aussi."

  - id: fusible
    name: Fusible 7B
    icon: { color: "#d94f4f", glyph: "7B" }
    look: "Un fusible « 7B ». Tiède. Tout est tiède sur cette station. C'est inquiétant."

  # ch.1 — le premier des 4 096 morceaux du Réacteur d'Improbabilité
  - id: fragment
    name: Éclat du Réacteur (1/4096)
    icon: { color: "#b56cff", glyph: "1/4096" }
    look:
      - if: { flags: [st] }
        say: "L'éclat 1/4096, dans la poche de poitrine de la combi. Tiède. Depuis qu'on est à la Station, il ronronne vers le fond du bâtiment. Vers le n° 2, je parie."
        stop: true
      - say: "Un éclat du Réacteur d'Improbabilité, gravé « Mk IV — 1/4096 ». Contenu dans une coque d'eau bénite figée, tiède. Il ronronne. Il ne fuit plus. Plus que 4 095. Et je n'ai plus de seau."
    combine:
      ticket_douane: "Coller l'éclat sur le ticket ? Il deviendrait un ticket improbable. Le portique en ferait une syncope."

      seau: "Il a déjà pris son bain. Un deuxième PLOUF, et il risque d'y prendre goût."
      combi_chitine: "Je le range dans la poche de poitrine de la combi. Elle a une poche de poitrine. Les cafards pensent à tout. Il en ressort tout seul. Bon."

  # ch.1 — la Mue Sacrée, remise au couronnement (ch1_combi)
  - id: combi_chitine
    name: Combinaison de chitine
    icon: { color: "#7a4a1e", glyph: "CHITINE" }
    look: "La Mue Sacrée : une combinaison de chitine tissée avec trois générations de mues royales. Plastron segmenté, épaulières en élytres, antennes décoratives. Elle résiste au vide, au feu, à l'improbabilité et à la honte. Il y a un peu de grand-mère dans l'épaule gauche."
    combine:
      badge: "J'accroche le badge sur le plastron. « GARRY », sur une armure de cafard. La RH n'a pas de formulaire pour ça. Pas encore."

  # ch.1 « La Station Bureaucratique » (docs/CHAPTER1.md §5)
  # payoff différé : présenté à la fourrière avec le permis de la Direction (fin du ch.1)
  - id: ticket_douane
    name: Ticket de douane
    icon: { color: "#f2e6c2", glyph: "D-0001" }
    look: "« TICKET D'ENTRÉE n° D-0001 — À PRÉSENTER À LA SORTIE ». La fourrière le réclame, avec un « permis de la Direction ». Je le garde. Précieusement. (À suivre.)"
    combine:
      ticket_9848: "Deux tickets ne font pas un rendez-vous. Je l'ai appris à mes dépens. Deux fois."
      plante: "Accrocher le ticket au ficus ? Il en ferait un sapin de Noël administratif. On n'est pas en décembre. On n'est même pas sûr d'être un jour."

  - id: ticket_9848
    name: Ticket n° 9848
    icon: { color: "#ffd166", glyph: "9848" }
    look: "Le ticket de M. Patience. « 9 848 ». L'afficheur en est au 9 847. Nous sommes les suivants. Depuis quarante et un ans, mais les suivants."
    combine:
      ticket_douane: "Deux tickets ne font pas un rendez-vous. Je l'ai appris à mes dépens. Deux fois."

  # payoff différé : repère dans le couloir infini B, puis membre honoraire du Conseil (quorum)
  - id: plante
    name: M. Ficus (plante en plastique)
    icon: { color: "#3e8f4a", glyph: "FICUS" }
    look:
      - if: { flags: [st_couloir_resolu] }
        say: "M. Ficus. Il a dénoué le Couloir Infini B sans bouger d'un millimètre. Étiquette : « MEMBRE HON. DU C... ». Du Conseil, j'en suis presque sûr maintenant. (À suivre.)"
        stop: true
      - say: "M. Ficus. En plastique. Étiquette : « MEMBRE HON. DU C... ». Du quoi ? Du Club ? Du Comité ? Du Conseil ? Il ne dit rien. Il a des principes. (À suivre.)"
    combine:
      ticket_douane: "Accrocher le ticket au ficus ? Il en ferait un sapin de Noël administratif. On n'est pas en décembre. On n'est même pas sûr d'être un jour."
      fragment: "L'éclat sur le ficus ? Il pourrait se mettre à pousser. Ou à voter. Gardons ça pour plus tard."

  # ouvre la carte de la Station (bouton PLAN du HUD ; content/station-map.yaml)
  - id: plan_station
    name: Plan de la Station
    icon: { color: "#f3ecd8", glyph: "PLAN" }
    look: "Le dépliant d'accueil, édition 1987. Les pièces que j'ai visitées sont blanches, les autres grisées « ACCÈS REFUSÉ » ou marquées « ??? ». On le déplie avec le bouton PLAN. Ou la touche P, pour les connaisseurs."

  # fin de l'Acte I (Accueil) : le dernier B-7/12, trouvé dans le casier du Couloir Infini B ;
  # vierge, cinq cases (rempli, tamponné, signé, conforme, ?) — la suite, dans les bureaux de l'Aile B
  - id: formulaire
    name: Formulaire B-7/12
    icon: { color: "#e8dcc0", glyph: "B-7/12" }
    look:
      # tableau de bord : les cases suivent les flags st_case_* (docs/CHAPTER1.md §2, §6)
      - if: { flags: [st_case_a] }
        say: "Le Formulaire B-7/12. Case A, IDENTITÉ : cochée, trois copies « CONFORME » agrafées. « PLUNK, GARRY — HUMAIN — INTÉRIMAIRE ». Cases B, C, D, E : vides."
        stop: true
      - say: "Le Formulaire B-7/12. Le dernier exemplaire. Légèrement jauni, parfaitement vierge. Cinq cases : A IDENTITÉ, B « VU », C TROIS EXEMPLAIRES, D SIGNATURE, et E, sans titre."
      - say: "En bas, en tout petit : « PIÈCES JUSTIFICATIVES À AGRAFER EN CASE A ». Agrafer quoi ? Je n'ai encore aucune pièce qui dise que j'existe."
    combine:
      # étape 20 : case A remplie, reclassement intérimaire (fin de l'Acte II)
      copies_dossier:
        - dialogue: st_reclassement
          take: copies_dossier
          set: st_case_a
        - set: st_reclasse
      plante: "Faire signer M. Ficus ? Il est membre honoraire de quelque chose. Mais pas aujourd'hui. Il est fatigué : il vient de dénouer un couloir."
      ticket_9848: "J'agrafe mentalement le ticket au formulaire. Mentalement, parce que je n'ai pas d'agrafeuse. Il y a sûrement un bureau pour ça."
      tampon_annule: "Tamponner « ANNULÉ » sur ma propre demande ? C'est très local, comme réflexe. Non."
      encreur: "Frotter le formulaire sur l'encreur ? Il est sec. Ça ne laisserait qu'une trace de déception."
      liasse: "Une liasse de réclamations et une demande de restitution : ce ne sont pas les mêmes formulaires. Ils ne se parlent pas. Ils sont de services différents."
      capsule: "Rouler le formulaire dans la capsule ? Il n'est pas prêt pour un voyage. Une case sur cinq, au mieux."
      badge: "Agrafer le badge ? Duplicata dirait que l'original ne s'agrafe pas. Il me faut des copies. Conformes."

  # Acte II « Humain, preuves à l'appui » (docs/CHAPTER1.md §5)
  # payoff différé : vote de Paraphe au Conseil (39), amende de la fourrière (45) ; jamais consommé
  - id: tampon_annule
    name: Tampon « ANNULÉ »
    icon: { color: "#c0392b", glyph: "ANNULÉ" }
    look: "Le tampon « ANNULÉ » de Mme Tamponnet. Quarante et un ans sur un crochet sans jamais servir. Le manche est encore propre. Ici, on n'annule jamais rien. Justement. (À suivre.)"
    combine:
      encreur: "Encrer le tampon ANNULÉ sur l'encreur sec ? Il en ressort aussi sec. Annulé, mais à blanc."
      ticket_douane: "Annuler mon ticket de sortie ? Il ne me resterait plus que l'entrée. C'est déjà le problème de toute cette Station."
      plante: "Annuler M. Ficus ? Il a dénoué un couloir. On n'annule pas un héros. Même en plastique."

  # payoff différé : imbibé de café (Acte III) puis rendu à Tamponnet pour le « VU »
  - id: encreur
    name: Encreur sec
    icon: { color: "#7a6a8a", glyph: "ENCRE" }
    look: "L'encreur de Mme Tamponnet. Feutre sec et craquelé, couleur lilas fatigué. « ENCRE OFFICIELLE — VOIR DÉLÉGUÉ DU PERSONNEL ». Il lui faudrait quelque chose de chaud et de syndiqué. (À suivre.)"
    combine:
      fragment: "L'éclat sur l'encreur ? Il pourrait se remplir d'encre improbable. Elle tamponnerait des choses qui n'existent pas. Ici, ce serait mal vu."
      copies_dossier: "Les copies sont déjà « CONFORME ». Duplicata a léché son tampon. Pas besoin d'encre de plus."

  - id: liasse
    name: Liasse de réclamations vierges
    icon: { color: "#cfe0c0", glyph: "LIASSE" }
    look: "Une liasse de formulaires de réclamation vierges, vert pâle, tenue par un élastique. Cinq cents réclamations que personne n'a jamais faites. Du papier. Le seul de la Station."
    combine:
      capsule: "Rouler une réclamation dans la capsule ? Le Conseil la recevrait vierge. Il voterait contre, par principe. Gardons la capsule pour un vrai message."

  # payoff différé : procuration de PERCO envoyée au Conseil par le tube (Acte IV)
  - id: capsule
    name: Capsule pneumatique
    icon: { color: "#c9d6e0", glyph: "TUBE" }
    look: "Une capsule de tube pneumatique, vide. « RÉCLAMATIONS → CONSEIL. USAGE : JAMAIS ». Elle va au Conseil. Il faudra y mettre quelque chose qui compte. (À suivre.)"

  - id: copies_dossier
    name: Copies du dossier « GARRY »
    icon: { color: "#e8e8e0", glyph: "×3" }
    look: "Trois photocopies de ma fiche : « PLUNK, GARRY — STATUT : HUMAIN. INTÉRIMAIRE. RENOUVELABLE PAR PITIÉ. » Tampon brunâtre « CONFORME », qui sent le café de 1985. Pièces justificatives : à agrafer au formulaire."
    combine:
      ticket_9848: "Agrafer le ticket de M. Patience à mon dossier ? Il a assez attendu pour nous deux. Je le laisse tranquille."
