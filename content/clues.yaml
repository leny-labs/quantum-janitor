# Carnet de déduction (ch.1) — indices. docs/CHAPTER1.md « Carnet de déduction ».
# Un indice est noté au carnet dès que `when` est vrai (flags / objets déjà posés par les looks
# et les dialogues) : rien à stocker, sauvegardes et ?flags= marchent tels quels.
#   id     clé stable (unique, partagée avec les ids de content/deductions.yaml)
#   title  / text : { fr, en } (le français est la source, l'anglais facultatif)
#   icon   pictogramme dessiné (clock, schedule, display, ticket, skeleton, stamp, speech, shard,
#          map, form, shutter) ou `item:<id>` (icône d'inventaire existante)
#   when   condition (flags, notFlags, items, notItems) — tous les indices exigent la Station (flag st) ; éclat et plan : après l'arrivée (st_arrive)
clues:
  - id: ticket_9848
    icon: item:ticket_9848
    when: { flags: [st_ticket_9848] }
    title: { fr: "Ticket n° 9 848", en: "Ticket no. 9,848" }
    text:
      fr: "Le ticket de M. Patience, aspiré par B.O.B. C'est le suivant. Ça fait quarante et un ans que c'est le suivant."
      en: "Mr Patience's ticket, vacuumed up by B.O.B. It's next. It has been next for forty-one years."

  - id: afficheur_9847
    icon: display
    when: { flags: [st_voit_afficheur] }
    title: { fr: "Afficheur : EN COURS 9 847", en: "Display: NOW SERVING 9,847" }
    text:
      fr: "Les afficheurs de l'attente et du guichet sont bloqués sur 9 847. Synchronisés. Sur l'immobilité."
      en: "The waiting-room and desk displays are stuck on 9,847. Synchronised. On standing still."

  - id: patience
    icon: skeleton
    when: { flags: [st_voit_patience] }
    title: { fr: "M. Patience (squelette)", en: "Mr Patience (skeleton)" }
    text:
      fr: "Un usager mort en attendant son tour, ticket 9 848 en main. Il a attendu plus longtemps que sa propre chair."
      en: "A customer who died waiting his turn, ticket 9,848 in hand. He outwaited his own flesh."

  - id: horloge_1011
    icon: clock
    when: { flags: [st_voit_horloge] }
    title: { fr: "Horloge : 10 h 11", en: "Clock: 10:11" }
    text:
      fr: "L'horloge du guichet marque 10 h 11. La trotteuse hésite sur la 59e seconde. Depuis 1985."
      en: "The desk clock says 10:11. The second hand dithers on the 59th second. Since 1985."

  - id: horaires
    icon: schedule
    when: { flags: [st_voit_horaires] }
    title: { fr: "Horaires : 10 h 12 – 10 h 14", en: "Hours: 10:12 – 10:14" }
    text:
      fr: "« GUICHET OUVERT DE 10 H 12 À 10 H 14. » Deux minutes d'ouverture par jour. En cas de fermeture, s'adresser au guichet."
      en: "“DESK OPEN 10:12 TO 10:14.” Two minutes a day. In case of closure, please apply at the desk."

  - id: horloge_tremble
    icon: shard
    when: { flags: [st_horloge_tremble] }
    title: { fr: "L'horloge a peur de l'éclat", en: "The clock is afraid of the shard" }
    text:
      fr: "Devant l'éclat, la grande aiguille a tremblé vers 10 h 12… puis elle est retombée. CLAC. Elle a senti quelque chose."
      en: "Faced with the shard, the minute hand trembled towards 10:12… then fell back. CLACK. It felt something."

  - id: guichard_ferme
    icon: speech
    when: { flags: [st_guichard_ferme] }
    title: { fr: "Mme Guichard : « C'est fermé. »", en: "Mrs Guichard: “We're closed.”" }
    text:
      fr: "« C'est pas moi qui décide. C'est l'horloge. Revenez à 10 h 12. » Avec le Formulaire B-7/12, qui se retire… au guichet."
      en: "“It's not me who decides. It's the clock. Come back at 10:12.” With Form B-7/12, which you collect… at the desk."

  - id: guichard_suivant
    icon: speech
    when: { flags: [st_guichard_ticket] }
    title: { fr: "Mme Guichard : « C'est le suivant. »", en: "Mrs Guichard: “That's next.”" }
    text:
      fr: "Le 9 848 est bien le suivant. Mais l'afficheur est au 9 847, et elle « ne prend pas d'avance ». Article 12 : les animaux passent après."
      en: "9,848 really is next. But the display says 9,847 and she “doesn't jump ahead”. Article 12: animals go after."

  - id: sabot_permis
    icon: stamp
    when: { flags: [st_sabot_vu] }
    title: { fr: "M. Sabot : ticket + permis", en: "Mr Sabot: ticket + permit" }
    text:
      fr: "Le gardien de la fourrière rendra le vaisseau contre le ticket d'entrée et le permis de la Direction. Tamponné. Évidemment."
      en: "The pound keeper will release the ship for the entry ticket and a permit from the Directorate. Stamped. Obviously."

  - id: plan_station
    icon: item:plan_station
    when: { flags: [st_arrive], items: [plan_station] }
    title: { fr: "Plan de la Station (1987)", en: "Station map (1987)" }
    text:
      fr: "Dépliant d'accueil, édition 1987. L'Aile B, l'Ascenseur à Formulaires, la Direction au niveau 12. Tout est « ACCÈS REFUSÉ », mais c'est imprimé en couleur."
      en: "Welcome leaflet, 1987 edition. Wing B, the Form Elevator, the Directorate on level 12. All “ACCESS DENIED”, but printed in colour."

  - id: eclat
    icon: item:fragment
    when: { flags: [st_arrive], items: [fragment] }
    title: { fr: "Éclat du Réacteur (1/4096)", en: "Reactor shard (1/4096)" }
    text:
      fr: "Un morceau d'improbabilité pure, dans ma poche. Là où il passe, les choses qui ne devraient pas arriver arrivent. Parfois."
      en: "A chunk of pure improbability, in my pocket. Wherever it goes, things that shouldn't happen happen. Sometimes."

  - id: guichet_ouvert
    icon: shutter
    when: { flags: [st_guichet_ouvert] }
    title: { fr: "10 h 12 : guichet ouvert", en: "10:12: desk open" }
    text:
      fr: "L'aiguille a franchi la minute. Le rideau est remonté, l'afficheur est passé au 9 848. Il reste deux minutes réglementaires."
      en: "The hand crossed the minute. The shutter went up, the display moved to 9,848. Two regulation minutes remain."

  - id: guichard_rupture
    icon: form
    when: { flags: [st_guichard_rupture] }
    title: { fr: "Mme Guichard : « En rupture. »", en: "Mrs Guichard: “Out of stock.”" }
    text:
      fr: "Le Formulaire B-7/12 est en rupture depuis 1985. Le dernier exemplaire est parti dans l'Aile B. Il faut le formulaire pour entrer dans l'Aile B."
      en: "Form B-7/12 has been out of stock since 1985. The last copy went into Wing B. You need the form to get into Wing B."

  # Aile B (fin de l'Acte I) : indices de contexte, pas de déduction obligatoire (le puzzle plante suffit)
  - id: acces_47bis
    icon: stamp
    when: { flags: [st_acces_aile_b] }
    title: { fr: "Article 47bis : demande verbale", en: "Article 47bis: verbal request" }
    text:
      fr: "En cas de rupture d'un formulaire requis pour accéder au stock dudit formulaire, l'usager peut formuler une demande verbale. Enregistrée. Valable jusqu'à 10 h 14."
      en: "Should a form required to access the stock of said form be out of stock, the customer may make a verbal request. Recorded. Valid until 10:14."

  - id: couloir_boucle
    icon: map
    when: { flags: [st_couloir_boucle] }
    title: { fr: "Le Couloir B boucle", en: "Corridor B loops" }
    text:
      fr: "Trois portes, un extincteur « NE PAS DÉPLACER ». On passe la B-3 et on revient à la B-1. Le même extincteur. Il faudrait un repère qui ne suive aucune procédure."
      en: "Three doors, one “DO NOT MOVE” extinguisher. Go through B-3 and you're back at B-1. Same extinguisher. I need a landmark that follows no procedure."

  - id: formulaire_trouve
    icon: form
    when: { flags: [st_formulaire] }
    title: { fr: "Le dernier B-7/12", en: "The last B-7/12" }
    text:
      fr: "Trouvé dans le casier « STOCK B-7/12 », une fois le couloir dénoué par M. Ficus. Vierge. Cinq cases. Les bureaux de l'Aile B sont ouverts « aux usagers munis d'un dossier »."
      en: "Found in the “B-7/12 STOCK” locker once Mr Ficus untangled the corridor. Blank. Five boxes. The Wing B offices are open “to customers with a file”."

  # Acte II « Humain, preuves à l'appui » : indices de contexte (le puzzle objet suffit, pas de déduction)
  - id: aucun_gary
    icon: speech
    when: { flags: [st_cherche_gary] }
    title: { fr: "« AUCUN GARY. AUCUN GARY. »", en: "“NO GARY. NO GARY.”" }
    text:
      fr: "M. Duplicata ne trouve aucun « PLUNK, GARY » aux Archives. Le fichier A–Z ne lit que les pièces d'identité : « il lit la pièce, pas la personne »."
      en: "Mr Duplicata can't find any “PLUNK, GARY” in the Archives. The A–Z cabinet only reads ID: “it reads the document, not the person”."

  - id: dossier_garry
    icon: form
    when: { flags: [st_dossier_trouve] }
    title: { fr: "Dossier « PLUNK, GARRY »", en: "File “PLUNK, GARRY”" }
    text:
      fr: "Tiroir G, par le badge aux deux R : « STATUT : HUMAIN. INTÉRIMAIRE. RENOUVELABLE PAR PITIÉ. » L'original ne sort pas ; Duplicata garde le badge. Il faut des copies, et la photocopieuse n'a plus de papier."
      en: "Drawer G, via the double-R badge: “STATUS: HUMAN. TEMP. RENEWABLE OUT OF PITY.” The original stays; Duplicata keeps the badge. I need copies, and the photocopier is out of paper."

  - id: tampon_annule_trouve
    icon: stamp
    when: { flags: [st_tamponnet] }
    title: { fr: "L'encre, c'était le café", en: "The ink was coffee" }
    text:
      fr: "Mme Tamponnet n'a plus d'encre depuis la grève : l'encre officielle, c'était le café de la machine de la pause, PERCO, déléguée du personnel. Elle m'a donné le tampon ANNULÉ, qui ne sert jamais."
      en: "Mrs Tamponnet has had no ink since the strike: the official ink was coffee from PERCO, the break-room machine and staff delegate. She gave me the CANCELLED stamp, which is never used."

  - id: chatiere_ouverte
    icon: shutter
    when: { flags: [st_chatiere] }
    title: { fr: "Chatière « ANIMAUX DE SERVICE »", en: "“SERVICE ANIMALS” flap" }
    text:
      fr: "Aux Réclamations, la chatière reconnaît la carapace de ma combinaison : je passe derrière le comptoir réservé au personnel. Il y a du papier vierge."
      en: "In Complaints, the flap recognises my suit's shell: I get behind the staff-only counter. There's blank paper."

  - id: case_a
    icon: form
    when: { flags: [st_case_a] }
    title: { fr: "Case A : humain (intérimaire)", en: "Box A: human (temp)" }
    text:
      fr: "Trois copies « CONFORME » agrafées au B-7/12 : case A remplie. Reclassement : INTÉRIMAIRE. (C'est pire.) Prochaine case : B, le « VU » des Tampons."
      en: "Three “CERTIFIED” copies stapled to the B-7/12: box A done. Reclassified: TEMP. (It's worse.) Next box: B, the Stamp Office “SEEN”."

  - id: greve
    icon: stamp
    when: { flags: [st_sait_greve] }
    title: { fr: "Pas d'encre, pas de « VU »", en: "No ink, no “SEEN”" }
    text:
      fr: "Mme Tamponnet ne peut pas tamponner la case B : pas d'encre tant que PERCO, la machine à café de la salle de pause, fait grève. Un intérimaire, ça peut signer pour quelqu'un qui n'est pas là…"
      en: "Mrs Tamponnet can't stamp box B: no ink while PERCO, the break-room coffee machine, is on strike. A temp can sign for someone who isn't there…"

  # Acte III « La Grève »
  - id: greve_p15
    icon: speech
    when: { flags: [st_greve_connue] }
    title: { fr: "PERCO : l'accord P-15", en: "PERCO: agreement P-15" }
    text:
      fr: "PERCO, déléguée du personnel, fait grève depuis 1985 (la pause est à 10 h 15, l'horloge à 10 h 11). Fin du conflit : l'accord P-15 signé « par la direction OU SON INTÉRIMAIRE »."
      en: "PERCO, staff delegate, has been on strike since 1985 (break is at 10:15, the clock at 10:11). End of dispute: agreement P-15 signed “by management OR ITS TEMP”."

  - id: delegation
    icon: form
    when: { flags: [st_voit_delegation] }
    title: { fr: "« Tout intérimaire signe p.o. »", en: "“Any temp signs p.p.”" }
    text:
      fr: "Note punaisée chez M. Delaigue, sous-chef adjoint p.i. : en cas d'absence (sommeil compris), tout intérimaire de la Station signe « pour ordre ». Il dort. Je suis intérimaire."
      en: "Memo pinned in Mr Delaigue's office (acting deputy assistant manager): in case of absence (sleep included), any temp in the Station signs “per pro”. He's asleep. I'm a temp."

  - id: greve_finie
    icon: stamp
    when: { flags: [st_greve_finie] }
    title: { fr: "Fin de la grève", en: "End of the strike" }
    text:
      fr: "Accord P-15 signé p.o., remis à PERCO : fin du conflit. Elle sert à nouveau du café tiède, « un à la fois », sans limite. L'encre, c'était le café."
      en: "Agreement P-15 signed p.p., handed to PERCO: dispute over. She serves lukewarm coffee again, “one at a time”, no limit. The ink was coffee."

  - id: delaigue_dort
    icon: speech
    when: { flags: [st_greve_connue], notFlags: [st_delaigue_reveille] }
    title: { fr: "M. Delaigue dort", en: "Mr Delaigue is asleep" }
    text:
      fr: "Le sous-chef adjoint dort sur son fax. Il ne se réveille qu'au mot « prime »… ou à l'odeur du café. Pour la signature hiérarchique (case D), il faudra qu'il soit réveillé."
      en: "The deputy assistant manager sleeps on his fax. He only wakes at the word “bonus”… or the smell of coffee. For the line-manager signature (box D), he'll have to be awake."

  - id: cases_bdc
    icon: form
    when: { flags: [st_case_c] }
    title: { fr: "Cases A, B, D, C", en: "Boxes A, B, D, C" }
    text:
      fr: "« VU » au café (Tamponnet), signature « p.i. » (Delaigue), trois exemplaires certifiés conformes (Duplicata). Il manque la case E : l'avis du Conseil. L'ascenseur ne monte que les dossiers complets aux trois quarts."
      en: "Coffee “SEEN” (Tamponnet), “acting” signature (Delaigue), three certified copies (Duplicata). Box E is missing: the Council's opinion. The elevator only takes files three-quarters complete."

  # Acte IV « Le Conseil et la Restitution »
  - id: quorum
    icon: speech
    when: { flags: [st_quorum_connu] }
    title: { fr: "Quorum : trois membres", en: "Quorum: three members" }
    text:
      fr: "Il faut trois membres pour voter l'avis de la case E. Je n'en vois qu'une : Mme Paraphe, la présidente. Le représentant du personnel est « à la pause » ; le membre honoraire n'a plus été vu depuis le déménagement."
      en: "It takes three members to vote on the box E opinion. I can only see one: Mrs Paraphe, the chair. The staff rep is “on break”; the honorary member hasn't been seen since the move."

  - id: tableau_membres
    icon: speech
    when: { flags: [st_voit_tableau] }
    title: { fr: "Tableau des membres du Conseil", en: "Council members board" }
    text:
      fr: "« PRÉSIDENTE : A. PARAPHE. REPRÉSENTANT DU PERSONNEL : PERCO. MEMBRE HONORAIRE : M. FICUS. QUORUM : 3. » Au crayon, à côté de M. Ficus : « en plastique depuis le déménagement »."
      en: "“CHAIR: A. PARAPHE. STAFF REPRESENTATIVE: PERCO. HONORARY MEMBER: MR FICUS. QUORUM: 3.” In pencil, next to Mr Ficus: “plastic since the move”."

  - id: vote_egalite
    icon: stamp
    when: { flags: [st_vote_egalite] }
    title: { fr: "Égalité : avis ajourné", en: "Tie: opinion postponed" }
    text:
      fr: "PERCO POUR (par tube, au café), M. Ficus abstention, Mme Paraphe CONTRE « par principe ». Personne n'a jamais annulé son vote. Ici, on n'annule jamais rien."
      en: "PERCO FOR (by tube, with coffee), Mr Ficus abstains, Mrs Paraphe AGAINST “on principle”. Nobody has ever cancelled her vote. Nothing is ever cancelled here."

  - id: depot_guichet
    icon: clock
    when: { flags: [st_sylvie_refuse] }
    title: { fr: "« Dépôt au guichet uniquement »", en: "“Desk submission only”" }
    text:
      fr: "SYLVIE ne reçoit pas le public : le dossier doit arriver par le guichet, à 10 h 12. Douze étages plus bas. Pour franchir trois mètres."
      en: "SYLVIE doesn't receive the public: the file must come through the desk, at 10:12. Twelve floors down. To cross three metres."

  - id: permis_sortie
    icon: ticket
    when: { flags: [st_eclat2] }
    title: { fr: "Permis + ticket d'entrée", en: "Permit + entry ticket" }
    text:
      fr: "Éclats fusionnés (2/4096), badge rendu, permis de quitter la dimension. M. Remorque, à la fourrière : ticket d'entrée + permis. Une amende tamponnée par le Bureau des Tampons fait foi."
      en: "Shards fused (2/4096), badge returned, permit to leave the dimension. Mr Remorque at the impound: entry ticket + permit. A fine stamped by the Stamp Office is binding."
