id: placard
title: Placard à balais
sector: Secteur Entretien · Klepsydra-9
icon: bucket
background: "#26332d"

# Décor placeholder (dessiné dans l'ordre)
art:
  - { rect: [0, 470, 1280, 110], color: "#1b231f" }                 # sol
  - { rect: [0, 462, 1280, 8], color: "#3b4a42" }
  - { circle: [640, 40, 18], color: "#fff4b0" }                       # ampoule
  - { rect: [636, 0, 8, 24], color: "#555555" }
  - { circle: [640, 40, 120], color: "#fff4b0", alpha: 0.06 }
  - { rect: [40, 90, 330, 16], color: "#5a4632" }                     # étagère haute
  - { rect: [40, 230, 330, 16], color: "#5a4632" }                    # étagère basse
  - { text: "PLACARD À BALAIS\nSecteur Entretien — Klepsydra-9", at: [640, 140], size: 16, color: "#6f8a7c" }

hotspots:
  - id: produits
    label: Produits ménagers
    smart: look
    rect: [50, 20, 310, 210]
    art:
      - { rect: [70, 40, 50, 50], color: "#b33a3a", stroke: "#ffffff", text: "JAVEL\nQ.", size: 11 }
      - { rect: [140, 30, 40, 60], color: "#3a8fb3", stroke: "#ffffff", text: "BRISE\nDU\nVIDE", size: 10 }
      - { rect: [200, 50, 70, 40], color: "#8f3ab3", stroke: "#ffffff", text: "ANTI-\nFLUX", size: 11 }
      - { rect: [80, 170, 90, 60], color: "#c9a13a", stroke: "#ffffff", text: "DÉGRAISSANT\nABSOLU", size: 10 }
      - { rect: [200, 180, 60, 50], color: "#3ab36b", stroke: "#ffffff", text: "???", size: 14 }
    look:
      - say: "Le bidon « ??? » est mon préféré. Il change d'odeur quand on ne le regarde pas."
    use: "Pas de fiche de sécurité, pas de contact. C'est ça, le professionnalisme."

  - id: seau
    label: Seau
    rect: [250, 360, 120, 120]
    if: { notFlags: [seau_pris] }
    art:
      - { rect: [262, 390, 96, 86], color: "#3d7dd8", stroke: "#ffffff" }
      - { rect: [262, 382, 96, 14], color: "#6fa8ff", stroke: "#ffffff" }
      - { text: "SEAU", at: [310, 435], size: 18, color: "#ffffff" }
    look: "Mon fidèle seau. Eau grise de catégorie 4. On a traversé beaucoup de choses ensemble. Surtout des sols."
    useLabel: Prendre
    use:
      - give: seau
        set: seau_pris
      - say: "Un agent d'entretien sans seau, c'est un capitaine sans vaisseau. Sauf que le capitaine, lui, a un CDI."

  - id: serpilliere
    label: Serpillière
    rect: [420, 150, 70, 330]
    if: { notFlags: [serpilliere_prise] }
    art:
      - { rect: [448, 160, 12, 270], color: "#8a6a3a" }
      - { rect: [425, 420, 58, 55], color: "#c9b458", stroke: "#ffffff", text: "SERP", size: 14 }
    look: "Ma serpillière. Elle s'appelle Josiane. Ne me demandez pas pourquoi. Elle non plus ne sait pas."
    useLabel: Prendre
    use:
      - give: serpilliere
        set: serpilliere_prise
      - say: "Allez, Josiane. On a du travail."

  - id: bob
    label: B.O.B. (aspirateur-robot)
    rect: [680, 420, 200, 80]
    art:
      - { rect: [700, 440, 160, 50], color: "#7c8794", stroke: "#ffffff" }
      - { circle: [745, 462, 7], color: "#ffffff" }
      - { circle: [815, 462, 7], color: "#ffffff" }
      - { text: "B.O.B.", at: [780, 480], size: 13, color: "#1a1a1a" }
      - { if: { notFlags: [bob_suit] }, text: "…", at: [780, 418], size: 22, color: "#bbbbbb" }
    look:
      - say: "Balayeur Organique Bienveillant. Programmé pour aspirer la poussière et, par erreur, pour ressentir des choses."
      - if: { notFlags: [bob_suit] }
        say: "Il fixe le mur depuis vingt minutes. Il fait ça quand il pense à l'entropie."
    talk:
      - if: { flags: [bob_suit] }
        dialogue: bob_compagnon
        stop: true
      - dialogue: bob
    useItem:
      sandwich:
        - dialogue: bob_sandwich
      seau:
        - say: "bob: Pas ton seau. Je suis étanche, mais pas émotionnellement."
          mood: sad
      serpilliere:
        - say: "bob: Tu veux me serpiller ? Je ne suis pas sale, Gary. Je suis juste... terne. À l'intérieur."
          mood: surprised
      badge:
        - say: "bob: Oui, c'est ton badge. Je suis content pour toi. Enfin, moins triste."
          mood: love
      fusible:
        - say: "bob: Je fonctionne sur batterie, Gary. Et sur la résignation."
          mood: sad
    useItemDefault:
      - say: "bob: Je ne peux pas aspirer ça. Je ne peux aspirer à rien. Même pas à une vie meilleure."
        mood: sad

  - id: casier
    label: Casier de Gary
    smart: look
    rect: [960, 110, 150, 360]
    art:
      - { rect: [970, 120, 130, 345], color: "#4a5560", stroke: "#9aa5b1" }
      - { rect: [985, 140, 100, 8], color: "#2e353c" }
      - { rect: [985, 155, 100, 8], color: "#2e353c" }
      - { rect: [985, 170, 100, 8], color: "#2e353c" }
      - { text: "G. PLUNK\n(intérim)", at: [1035, 230], size: 14, color: "#ffffff" }
    look: "Une photo de ma mère, qui me croit capitaine ; un guide « Survivre en intérim spatial » ; et ma dignité, roulée en boule."
    use: "Rien d'utile là-dedans. Sauf si on doit vaincre l'univers avec de la culpabilité maternelle."

  - id: affiche
    label: Plaque réglementaire
    rect: [560, 190, 190, 150]
    art:
      - { rect: [565, 195, 180, 140], color: "#e8e1c8", stroke: "#b33a3a" }
      - { text: "RÈGLEMENT\nN°1 :\nNE JAMAIS\nNETTOYER LE\nRÉACTEUR", at: [655, 265], size: 14, color: "#b33a3a" }
    look:
      - say: "Au marqueur : « Règlement n°2 : voir règlement n°1. Sérieusement, Gary. » Ils m'ont nommé. Sur une plaque émaillée. C'est presque une promotion."

exits:
  - id: vers_couloir
    label: Couloir de service
    to: couloir
    dir: right
    rect: [1150, 140, 120, 330]

onFirstEnter:
  - dialogue: intro
