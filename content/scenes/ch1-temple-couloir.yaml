# Chapitre 1 — le morceau du couloir C de Klepsydra-9, échoué dans B-7 et vénéré.
id: temple-couloir
title: Temple de l'Ancien Couloir
sector: B-7 · Fragment K9-C
icon: corridor
background: "#1f2230"

onFirstEnter:
  - say: "Le couloir C. MON couloir C. Échoué ici, couvert d'offrandes et de cire de bougie. Je l'ai serpillé tous les jours pendant trois ans, et c'est maintenant qu'il devient sacré."
  - say: "bob: (la bouche encore pleine) Il est plus propre que dans mon souvenir. Les cafards l'entretiennent. Ils ont un meilleur contrat que toi."
    mood: suspicious
  - say: "narrateur: La gravité hésite. Une bougie tombe vers le plafond, se ravise, retombe. B.O.B. décolle de deux centimètres et n'aime pas ça."
    shake: true

art:
  - { rect: [0, 470, 1280, 110], color: "#171b28" }
  - { rect: [0, 462, 1280, 8], color: "#3a4260" }
  - { rect: [0, 30, 1280, 10], color: "#3a4260" }
  - { rect: [0, 40, 1280, 4], color: "#ffd166", alpha: 0.5 }                 # rail lumineux, en cire
  - { circle: [0, 300, 260], color: "#3a1e14", alpha: 0.75 }                 # la paroi organique de B-7 mange les bords
  - { circle: [1280, 300, 260], color: "#3a1e14", alpha: 0.75 }
  - { circle: [450, 455, 8], color: "#ffd166" }                              # bougies
  - { circle: [480, 458, 6], color: "#ffd166" }
  - { circle: [600, 455, 7], color: "#ffd166" }
  - { image: roach2d, at: [540, 470], scale: 0.16, flipX: true }            # un fidèle en adoration

hotspots:
  - id: distributeur
    label: Reliquaire « Distrib'Ô-Matic 3000 »
    smart: menu
    rect: [180, 110, 220, 360]
    art:
      - { rect: [190, 120, 200, 345], color: "#8a2b3c", stroke: "#ffd166" }
      - { rect: [210, 140, 160, 220], color: "#1a2a3a", stroke: "#9fd8ff", alpha: 0.9 }
      - { text: "DISTRIB'Ô-MATIC 3000\n✦ RELIQUAIRE ✦", at: [290, 390], size: 12, color: "#ffffff" }
      - { rect: [230, 420, 120, 28], color: "#111111" }
      - { if: { notFlags: [ch1_eclat_tombe] }, circle: [290, 250, 26], color: "#b56cff", stroke: "#ffffff" }
      - { if: { notFlags: [ch1_eclat_tombe] }, circle: [290, 250, 50], color: "#b56cff", alpha: 0.25 }
      - { if: { flags: [ch1_eclat_tombe], notFlags: [ch1_eclat_stabilise] }, circle: [290, 434, 12], color: "#b56cff", stroke: "#ffffff" }
    look:
      - if: { flags: [ch1_josiane_coincee, ch1_eclat_stabilise] }
        say: "Josiane, dans la vitrine, entre deux spirales. Les fidèles lui ont mis une bougie. Elle a l'air bien. Mieux que moi."
        stop: true
      - if: { flags: [ch1_josiane_coincee] }
        say: "Josiane, coincée dans la spirale, à la place de l'éclat. L'éclat, lui, pulse dans le logement de sortie. Trop chaud pour la main."
        stop: true
      - say: "Le Distrib'Ô-Matic. Derrière la spirale, à la place du sandwich : un éclat qui vibre d'improbabilité. Il est coincé. Évidemment. Ce distributeur coince TOUT."
        set: ch1_voit_eclat
      - say: "bob: Un morceau du Réacteur, Gary. Le premier des 4 096. Je le sens d'ici. Il a le même humour que la station."
        mood: surprised
    use:
      - if: { flags: [ch1_josiane_coincee] }
        say: "narrateur: Gary donne un coup de pied, pour Josiane. L'écran affiche : « COUP DE PIED FACTURÉ : 2 CRÉDITS. ARTICLE TOUJOURS NON DISTRIBUABLE »."
        stop: true
      - say: "narrateur: Coup de pied. L'écran, sous la cire, affiche encore : « COUP DE PIED FACTURÉ : 2 CRÉDITS »."
      - say: "Même dans une autre dimension, il me facture. C'est presque rassurant."
    useItem:
      serpilliere:
        - if: { notFlags: [ch1_voit_eclat] }
          say: "Décoincer quoi ? Je ne sais même pas ce qu'il y a dedans. Regardons d'abord."
          stop: true
        # Josiane reste coincée dans la spirale (ch1_josiane_coincee, quitte l'inventaire)
        - dialogue: ch1_josiane
      badge: "« BADGE NON RECONNU. CE DISTRIBUTEUR EST DÉSORMAIS UN LIEU DE CULTE. » Même lui a eu une promotion."
      seau: "Verser de l'eau dans un distributeur ? Ça, c'est le geste qui détruit des stations. J'ai donné."

  - id: compteur
    label: Panneau « Jours sans incident »
    rect: [680, 280, 240, 90]
    art:
      - { rect: [690, 290, 220, 70], color: "#111111", stroke: "#7fffd4" }
      - { text: "KLEPSYDRA-9\n0000 JOURS SANS INCIDENT\nD'IMPROBABILITÉ", at: [800, 325], size: 13, color: "#ff5c7a" }
    look: "« 0000 jours sans incident ». On a perdu le record. Et la station. Et la notion de « jour »."

  - id: hublot
    label: Hublot
    rect: [680, 90, 240, 160]
    art:
      - { rect: [690, 100, 220, 140], color: "#05050c", stroke: "#9aa5b1" }
      - { rect: [700, 110, 60, 50], color: "#3d7dd8", alpha: 0.6 }
      - { rect: [770, 110, 60, 50], color: "#b56cff", alpha: 0.6 }
      - { rect: [840, 110, 60, 50], color: "#ffd166", alpha: 0.6 }
      - { rect: [700, 170, 60, 60], color: "#7fffd4", alpha: 0.6 }
      - { rect: [770, 170, 60, 60], color: "#ff5c7a", alpha: 0.6 }
      - { rect: [840, 170, 60, 60], color: "#8fae3a", alpha: 0.6 }
    look: "Le multivers, en mosaïque. 4 096 carreaux. Dans chacun, un morceau de station. Et sûrement un Gary qui se demande s'il a éteint le gaz."

  - id: lecteur
    label: Lecteur de badge
    rect: [1000, 240, 70, 110]
    art:
      - { rect: [1010, 250, 50, 90], color: "#2a2a2a", stroke: "#ffffff" }
      - { rect: [1012, 300, 46, 22], color: "#7fbf3f", alpha: 0.35 }
    look: "Des traces de yaourt sur le lecteur. Des traces qui s'éloignent. Le yaourt est parti. À pied. Il n'a pas de pieds."
    useItem:
      badge:
        - say: "narrateur: Bip."
        - say: "sylvie: ...GARRY... HORS... JURIDICTION... BONHEUR... NON... GARANTI..."
          mood: suspicious
        - say: "SYLVIE ? ...Un écho. Elle est quelque part, de l'autre côté. Elle me manque. Non. Si. Un peu. Non."
      serpilliere: "Serpiller ce lecteur ? J'ai déjà donné. C'est comme ça que tout a commencé."

  - id: bob
    label: B.O.B.
    rect: [760, 440, 170, 70]
    art:
      - { rect: [775, 455, 140, 45], color: "#7c8794", stroke: "#ffffff" }
      - { circle: [815, 474, 6], color: "#ffffff" }
      - { circle: [875, 474, 6], color: "#ffffff" }
    look: "B.O.B. a des miettes saintes plein les brosses. Il a l'air presque serein. C'est inquiétant."
    talk:
      - dialogue: ch1_bob
    useItemDefault:
      - say: "bob: Non merci, Gary. Je digère le goûter sacré. C'est une expérience spirituelle."
        mood: love

exits:
  - id: vers_galerie
    label: Galerie des Offrandes
    to: galerie-des-offrandes
    dir: left
    rect: [10, 140, 110, 330]
  - id: vers_eclat
    label: L'éclat du Réacteur
    to: coeur-eclat
    dir: up
    rect: [250, 478, 80, 54]
    # n'apparaît qu'une fois l'éclat tombé dans le logement de sortie ; au sol,
    # sous le bac du distributeur (x centré), hors du rect du hotspot et du fidèle à [470, 500]
    if: { flags: [ch1_eclat_tombe] }
