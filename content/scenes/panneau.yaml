id: panneau
title: Panneau de contrôle du réacteur (gros plan)
background: "#10161f"

art:
  - { rect: [40, 30, 1200, 510], color: "#1b2533", stroke: "#4a5a70" }
  - { text: "CONSOLE DE STABILISATION — RÉACTEUR D'IMPROBABILITÉ Mk IV", at: [640, 50], size: 16, color: "#9aa5b1" }

hotspots:
  - id: ecran
    label: Écran de diagnostic
    rect: [360, 80, 560, 220]
    art:
      - { rect: [370, 90, 540, 200], color: "#050a08", stroke: "#7fffd4" }
      - { if: { notFlags: [panneau_allume] }, text: "— HORS TENSION —\n\nfusible stabilisateur 7B absent", at: [640, 190], size: 18, color: "#335544" }
      - { if: { flags: [panneau_allume], notFlags: [refroidissement_verse] }, text: "ALIMENTATION ....... OK\nREFROIDISSEMENT .... 0 %\nSTABILITÉ ...... CRITIQUE\n\n> REMPLIR LE RÉSERVOIR", at: [640, 190], size: 20, color: "#7fffd4" }
      - { if: { flags: [refroidissement_verse] }, text: "ALIMENTATION ....... OK\nREFROIDISSEMENT .. 100 %\nCOMPOSITION ...... ???\n\n> APPUYER SUR STABILISER", at: [640, 190], size: 20, color: "#ffd166" }
    look:
      - if: { notFlags: [panneau_allume] }
        say: "L'écran est éteint. Juste une ligne en veille : « fusible stabilisateur 7B absent »."
        set: sait_fusible
      - if: { notFlags: [panneau_allume] }
        say: "7B... Le circuit du distributeur du couloir est aussi marqué 7B. Ce serait une coïncidence improbable. On est à côté d'un Réacteur d'Improbabilité."
        stop: true
      - if: { notFlags: [refroidissement_verse] }
        say: "Refroidissement : 0 %. Il faut remplir le réservoir par la trappe d'admission, dans le labo."
        stop: true
      - say: "« Composition : ??? ». Les points d'interrogation sur un écran de réacteur, ce n'est jamais bon signe."

  - id: logement
    label: Logement du fusible stabilisateur
    rect: [110, 320, 200, 170]
    art:
      - { rect: [120, 330, 180, 150], color: "#2a3444", stroke: "#ffd166" }
      - { text: "STABILISATEUR\n7B", at: [210, 360], size: 13, color: "#ffd166" }
      - { if: { notFlags: [fusible_pose] }, rect: [185, 400, 50, 50], color: "#000000", stroke: "#666666" }
      - { if: { flags: [fusible_pose] }, rect: [185, 400, 50, 50], color: "#d94f4f", stroke: "#ffffff", text: "7B", size: 14 }
    look:
      - if: { flags: [fusible_pose] }
        say: "Le fusible 7B est en place. Le distributeur me manque un peu. Non, en fait, pas du tout."
        stop: true
      - say: "Un logement vide, marqué « STABILISATEUR — 7B ». Il y avait un fusible ici. Quelqu'un a dû l'emprunter pour faire marcher autre chose."
        set: sait_fusible
      - say: "Sept B... Comme le circuit du distributeur dans le couloir. Les ingénieurs de cette station réutilisent les numéros. Ou ils sont fainéants. Ou les deux."
    use: "Il faut un fusible 7B pour ce logement."
    useItem:
      fusible:
        - dialogue: fusible_pose

  - id: cadran
    label: Cadran d'improbabilité
    rect: [420, 330, 400, 160]
    art:
      - { rect: [430, 340, 380, 140], color: "#222c3a", stroke: "#9aa5b1" }
      - { text: "PROBABLE   ·   IMPROBABLE   ·   GARY", at: [620, 370], size: 15, color: "#ffffff" }
      - { if: { notFlags: [refroidissement_verse] }, rect: [600, 395, 6, 70], color: "#ff5c7a" }
      - { if: { flags: [refroidissement_verse] }, rect: [760, 395, 6, 70], color: "#ff5c7a" }
    look:
      - say: "Un cadran gradué de « PROBABLE » à « IMPROBABLE ». La dernière graduation dit « GARY »."
      - say: "Je ne sais pas si je dois être vexé ou flatté. Je choisis vexé. C'est plus confortable."
    use: "Je tapote le cadran. L'aiguille tapote en retour. Je n'aime pas ça."

  - id: bouton
    label: Gros bouton rouge « STABILISER »
    rect: [880, 320, 260, 180]
    art:
      - { rect: [890, 330, 240, 160], color: "#2a1a1a", stroke: "#ff5c7a" }
      - { circle: [1010, 405, 55], color: "#d62839", stroke: "#ffffff" }
      - { text: "STABILISER", at: [1010, 405], size: 16, color: "#ffffff" }
      - { text: "(ne pas appuyer sans raison)", at: [1010, 475], size: 11, color: "#ff99aa" }
    look: "Un gros bouton rouge marqué « STABILISER ». Les gros boutons rouges veulent toujours qu'on appuie dessus. C'est leur seul but dans la vie. Je les comprends."
    useLabel: Appuyer
    use:
      - if: { notFlags: [panneau_allume] }
        say: "narrateur: Clic. Rien. Le panneau est hors tension."
        stop: true
      - if: { notFlags: [refroidissement_verse] }
        say: "sylvie: STABILISATION IMPOSSIBLE. NIVEAU DE REFROIDISSEMENT : 0 %. VEUILLEZ REMPLIR LE RÉSERVOIR."
        stop: true
      - dialogue: catastrophe

exits:
  - id: retour_labo
    label: Retour au labo
    to: labo
    dir: down
    rect: [540, 500, 200, 70]
