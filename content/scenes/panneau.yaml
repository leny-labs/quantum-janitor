id: panneau
title: Console du réacteur
sector: Laboratoire · Gros plan
icon: console
background: "#10161f"

art:
  - { rect: [207, 103, 866, 368], color: "#1b2533", stroke: "#4a5a70" }
  - { text: "CONSOLE DE STABILISATION — RÉACTEUR D'IMPROBABILITÉ Mk IV", at: [640, 117], size: 11, color: "#9aa5b1" }

hotspots:
  - id: ecran
    label: Écran de diagnostic
    rect: [438, 139, 404, 158]
    art:
      - { rect: [446, 146, 390, 144], color: "#050a08", stroke: "#7fffd4" }
      - { if: { notFlags: [panneau_allume] }, text: "— HORS TENSION —\n\nfusible stabilisateur 7B absent", at: [640, 218], size: 13, color: "#335544" }
      - { if: { flags: [panneau_allume], notFlags: [refroidissement_verse] }, text: "ALIMENTATION ....... OK\nREFROIDISSEMENT .... 0 %\nSTABILITÉ ...... CRITIQUE\n\n> REMPLIR LE RÉSERVOIR", at: [640, 218], size: 14, color: "#7fffd4" }
      - { if: { flags: [refroidissement_verse] }, text: "ALIMENTATION ....... OK\nREFROIDISSEMENT .. 100 %\nCOMPOSITION ...... ???\n\n> APPUYER SUR STABILISER", at: [640, 218], size: 14, color: "#ffd166" }
    look:
      - if: { notFlags: [panneau_allume] }
        say: "« Fusible 7B absent ». 7B, comme le distributeur du couloir. Coïncidence improbable. À côté d'un Réacteur d'Improbabilité."
        set: sait_fusible
        stop: true
      - if: { notFlags: [refroidissement_verse] }
        say: "0 %. À remplir par la trappe d'admission, dans le labo."
        stop: true
      - say: "« Composition : ??? ». Les points d'interrogation sur un écran de réacteur, ce n'est jamais bon signe."

  - id: logement
    label: Logement du fusible stabilisateur
    smart: look
    rect: [257, 312, 144, 122]
    art:
      - { rect: [265, 319, 130, 108], color: "#2a3444", stroke: "#ffd166" }
      - { text: "STABILISATEUR\n7B", at: [329, 340], size: 10, color: "#ffd166" }
      - { if: { notFlags: [fusible_pose] }, rect: [312, 369, 36, 36], color: "#000000", stroke: "#666666" }
      - { if: { flags: [fusible_pose] }, rect: [312, 369, 36, 36], color: "#d94f4f", stroke: "#ffffff", text: "7B", size: 10 }
    look:
      - if: { flags: [fusible_pose] }
        say: "Le 7B est en place. Le distributeur me manque un peu. Non, en fait, pas du tout."
        stop: true
      - say: "Vide. 7B, comme le circuit du distributeur du couloir. Les ingénieurs recyclent les numéros. Ou ils sont fainéants. Ou les deux."
        set: sait_fusible
    use: "Il faut un fusible 7B pour ce logement."
    useItem:
      fusible:
        - dialogue: fusible_pose

  - id: cadran
    label: Cadran d'improbabilité
    smart: look
    rect: [482, 319, 289, 115]
    art:
      - { rect: [489, 326, 275, 101], color: "#222c3a", stroke: "#9aa5b1" }
      - { text: "PROBABLE   ·   IMPROBABLE   ·   GARY", at: [626, 348], size: 11, color: "#ffffff" }
      - { if: { notFlags: [refroidissement_verse] }, rect: [611, 366, 4, 50], color: "#ff5c7a" }
      - { if: { flags: [refroidissement_verse] }, rect: [726, 366, 4, 50], color: "#ff5c7a" }
    look:
      - say: "La dernière graduation dit « GARY ». Vexé ou flatté ? Vexé. C'est plus confortable."
    use: "Je tapote le cadran. L'aiguille tapote en retour. Je n'aime pas ça."

  - id: bouton
    label: Gros bouton rouge « STABILISER »
    rect: [813, 312, 187, 130]
    art:
      - { rect: [820, 319, 173, 115], color: "#2a1a1a", stroke: "#ff5c7a" }
      - { circle: [907, 373, 40], color: "#d62839", stroke: "#ffffff" }
      - { text: "STABILISER", at: [907, 373], size: 11, color: "#ffffff" }
      - { text: "(ne pas appuyer sans raison)", at: [907, 424], size: 8, color: "#ff99aa" }
    look: "Les gros boutons rouges veulent toujours qu'on appuie dessus. C'est leur seul but dans la vie. Je les comprends."
    useLabel: Appuyer
    use:
      - if: { notFlags: [panneau_allume] }
        say: "narrateur: Clic. Rien. Le panneau est hors tension."
        stop: true
      - if: { notFlags: [refroidissement_verse] }
        say: "sylvie: STABILISATION IMPOSSIBLE. RÉSERVOIR VIDE."
        stop: true
      - dialogue: catastrophe

exits:
  - id: retour_labo
    label: Retour au labo
    to: labo
    dir: down
    rect: [540, 500, 200, 70]
