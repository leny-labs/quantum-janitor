# Chapitre 1 « La Station Bureaucratique » — 2. Salle d'Attente (docs/CHAPTER1.md §4, §9).
# Rendu 3D : src/three/rooms/station.ts (stAttente). `art:` = repli 2D.
# Mini-puzzle : l'afficheur (9 847), M. Patience et son ticket 9 848 (main serrée), B.O.B. aspire
# le ticket ; fausse piste au distributeur. M. Ficus (plante) est à la cafétéria, à côté de PERCO-JUNIOR.
# Sortie vers le guichet (st-guichet, Mme Guichard) une fois le ticket 9 848 en poche.
id: st-attente
title: Salle d'Attente
sector: Station Bureaucratique · Niveau 0 · Patientez
icon: corridor
background: "#2e2c26"

art:
  - { rect: [0, 470, 1280, 110], color: "#4a4436" }
  - { rect: [0, 0, 1280, 470], color: "#b8b08f" }

hotspots:
  - id: afficheur
    label: Afficheur « NOUS SERVONS LE N° »
    smart: look
    rect: [500, 40, 280, 100]
    art:
      - { rect: [510, 50, 260, 80], color: "#140a0a", stroke: "#ff4f5a", text: "9 847", size: 34 }
    look:
      - say: "« NOUS SERVONS LE NUMÉRO : 9 847 ». Les chiffres sont gravés à même la diode. Quelqu'un a compris que ça ne changerait plus."
        set: st_voit_afficheur
    use: "Je tapote l'afficheur. Il clignote, par politesse. 9 847. On ne brusque pas un afficheur."

  - id: squelette
    label: M. Patience
    rect: [225, 320, 125, 165]
    art:
      - { circle: [265, 260, 26], color: "#efe6cf", stroke: "#3a3842" }
      - { rect: [235, 290, 60, 110], color: "#efe6cf", stroke: "#3a3842" }
      - { rect: [300, 330, 30, 20], color: "#ffffff", text: "9848", size: 9 }
    look:
      - say: "Un squelette, assis bien droit sur une chaise vissée. Costume trois-pièces, chapeau sur les genoux. Une étiquette autour du cou : « M. PATIENCE — USAGER »."
        set: st_voit_patience
      - if: { notFlags: [st_ticket_9848] }
        say: "Dans sa main droite, serré entre deux phalanges, un ticket : « 9 848 ». Il attendait d'être le suivant. Il l'est toujours."
      - if: { flags: [st_ticket_9848] }
        say: "Ses doigts sont retombés sur ses genoux. Il a l'air soulagé. On lui a enfin dit qu'il pouvait partir."
    use:
      - if: { flags: [st_ticket_9848] }
        say: "Je lui ai déjà pris son ticket. Je ne vais pas lui prendre son chapeau. Il y a des limites. Je viens de les découvrir."
        stop: true
      - say: "narrateur: Gary tire doucement sur le ticket. Les phalanges ne bougent pas d'un millimètre. Quarante et un ans de patience, ça fait une sacrée poigne."
        set: st_main_serree
      - say: "Il ne lâche rien. Pas avec des doigts, en tout cas. Il faudrait quelque chose de plus... aspirant."
    talk:
      - say: "Bonjour, monsieur. Vous attendez depuis longtemps ?"
      - say: "narrateur: M. Patience ne répond pas. Sa mâchoire, légèrement décrochée, a l'air de dire « à qui le dites-vous »."
        set: st_voit_patience
    useItem:
      ticket_douane: "Lui proposer un échange ? Un ticket de douane contre son 9 848 ? Il ne fait pas d'échange. Il n'a même jamais fait la queue ailleurs."
      plante: "Je lui laisse M. Ficus pour lui tenir compagnie ? ...Non. M. Ficus vient avec moi. Je le sens. Il a un rôle à jouer."
      badge: "« GARRY PLUNK ». Il ne regarde même pas. Il en a vu passer, des badges. Il les a tous vus repasser."

  - id: distributeur
    label: Distributeur de tickets
    sfx: clonk
    rect: [860, 180, 130, 260]
    art:
      - { rect: [870, 190, 110, 240], color: "#c0392b", stroke: "#ffffff", text: "TICKETS", size: 14 }
    look: "Un distributeur de tickets rouge. Écran : « RUPTURE — FORMULAIRE DE RÉAPPROVISIONNEMENT DISPONIBLE AU GUICHET ». Le guichet, pour lequel il faut un ticket."
    use:
      - say: "narrateur: Gary appuie sur le gros bouton. Le distributeur mouline, vrombit, et sort... un ticket blanc, vierge, qui dit « NUMÉRO EN ATTENTE DE NUMÉROTATION »."
      - say: "Il le ravale aussitôt. Il a honte, je crois."
    useItem:
      ticket_douane:
        - say: "narrateur: Le distributeur avale le ticket de douane, le goûte, et le recrache avec dédain. « TICKET NON RECONNU : CECI N'EST PAS UNE ATTENTE, CECI EST UNE DOUANE »."
        - say: "Il y a une hiérarchie des tickets. Je l'ignorais. Je suis tout en bas, avec mon ticket de douane."
      fragment: "L'éclat dans le distributeur ? Il en sortirait un ticket « ∞ ». Et on attendrait encore plus longtemps."

  - id: bob
    label: B.O.B.
    # à droite, à côté du distributeur : équilibre M. Patience (à gauche) ;
    # yeux au-dessus du HUD, face/¾ caméra (docs/CHAPTERS.md)
    rect: [880, 415, 150, 80]
    art:
      - { rect: [885, 430, 140, 50], color: "#7c8794", stroke: "#ffffff" }
    look: "B.O.B. tient toujours ma laisse, du bout de l'antenne. Il fixe M. Patience avec respect. Et un peu d'appétit, je crois."
    talk:
      - dialogue: st_patience
    useItem:
      ticket_9848: "bob: Il est à nous, maintenant. Ne le perds pas, Gary. On n'aspire pas deux fois le même mort."
      plante: "bob: M. Ficus ? Je ne l'aspire pas. Il a une étiquette. Les choses qui ont une étiquette, ici, sont plus importantes que nous."
    useItemDefault:
      - say: "bob: Je suis ton propriétaire, pas ta poubelle. Enfin. Pas aujourd'hui."
        mood: sad

  # zooms examine sur les détails (après leurs parents : zones plus petites, prioritaires au clic)
  - id: horloge
    label: Horloge
    smart: look
    rect: [938, 40, 84, 84]
    look:
      - say: "Une horloge murale. 10 h 11. Pas de trotteuse : ici, on a jugé que les secondes étaient une provocation."
      - say: "Le guichet ouvre à 10 h 12. L'horloge le sait. Elle fait exprès, je crois."

  - id: horaires
    label: Affiche « GUICHET 10 H 12 – 10 H 14 »
    smart: look
    rect: [1052, 56, 118, 116]
    look:
      - say: "« GUICHET — 10 H 12 – 10 H 14 ». Deux minutes d'ouverture. L'affiche est jaunie, cornée, punaisée quatre fois. Elle a vu passer beaucoup d'espoirs."
      - say: "Et l'horloge, juste à côté, qui affiche 10 h 11. Ils se regardent en chiens de faïence. Aucun des deux ne cède."

  - id: affiche_patience
    label: Affiche « LA PATIENCE EST UNE VERTU »
    smart: look
    rect: [378, 156, 114, 86]
    look:
      - say: "« LA PATIENCE EST UNE VERTU (ART. 12) ». Un article de loi. La patience est réglementaire. Ne pas être patient, c'est une infraction."
      - say: "Juste en dessous, M. Patience. Je ne sais pas qui a été accroché en premier. L'affiche, j'espère."

  - id: ticket_patience
    label: Ticket « 9 848 »
    rect: [318, 336, 44, 34]
    if: { notFlags: [st_ticket_9848] }
    look:
      - say: "Le ticket, de près : « 9 848 ». Papier bristol, bande verte, coin mâchonné. Serré entre deux phalanges comme un billet gagnant."
        set: st_voit_patience
      - say: "Un seul numéro après celui de l'afficheur. Il était le suivant. Il a attendu d'être appelé. Il l'attend encore."
    use:
      - say: "narrateur: Gary tire doucement sur le ticket. Les phalanges ne bougent pas d'un millimètre. Quarante et un ans de patience, ça fait une sacrée poigne."
        set: st_main_serree
      - say: "Il ne lâche rien. Pas avec des doigts, en tout cas. Il faudrait quelque chose de plus... aspirant."
    useItem:
      ticket_douane: "Lui proposer un échange ? Un ticket de douane contre son 9 848 ? Il ne fait pas d'échange. Il n'a même jamais fait la queue ailleurs."
      badge: "« GARRY PLUNK ». Il ne regarde même pas. Il en a vu passer, des badges. Il les a tous vus repasser."

exits:
  - id: vers_sas
    label: Sas d'Arrivée
    to: st-sas
    dir: left
    rect: [10, 140, 100, 320]
  # double porte battante au fond, entre la rangée de sièges (≤ 600 px) et le distributeur (860 px)
  - id: vers_cafeteria
    label: Cafétéria
    to: st-cafeteria
    dir: up
    rect: [622, 168, 228, 282]
  # guichet d'accueil jouable (Mme Guichard, rideau, horloge 10 h 11) une fois le ticket en poche
  - id: vers_guichet
    label: Guichet d'Accueil
    to: st-guichet
    dir: right
    rect: [1170, 140, 100, 320]
    requires: { items: [ticket_9848] }
    lockedText:
      - say: "Une pancarte sur la porte du guichet : « MUNISSEZ-VOUS D'UN TICKET AVANT DE VOUS PRÉSENTER ». Je n'en ai pas. Enfin, pas le bon."
