# Chapitre 1 « La Station Bureaucratique » — 13. Fourrière & Quai des Navettes (docs/CHAPTER1.md §4, §6.44–46, §8).
# Rendu 3D : src/three/rooms/station.ts (stFourriere). `art:` = repli 2D.
# La capsule CS-07, sabot aux patins ; M. Remorque (gardien, ≠ M. Sabot du sas) dans sa guérite ; panneau des amendes.
#   ticket de douane sur Remorque (permis en poche) → amende 4 096 crédits           [st_amende] −ticket_douane
#   tampon ANNULÉ sur l'amende                   → « ça, c'est réglementaire »      [st_vaisseau_libere]
#   permis sur la capsule                        → décollage → `end: st_suite`     −permis
# Accès depuis le sas, avec le permis de la Direction (st_eclat2).
id: st-fourriere
title: Fourrière & Quai des Navettes
sector: Station Bureaucratique · Niveau −1 · Quai
icon: console
background: "#14181c"

onFirstEnter:
  - say: "La Fourrière. Un quai noyé de néons jaunes, une guérite, et notre capsule CS-07, garée en travers, un sabot jaune sur le patin avant."
  - say: "remorque: Un piéton. Sur mon quai. Avec un permis à la main. Mon collègue Sabot m'a prévenu. Il a dit : « Il reviendra jamais. » Il se trompe rarement. Je note."
  - say: "bob: Notre capsule, Gary ! Elle a l'air vexée. Elle n'a jamais été garée en travers de quoi que ce soit. À part une dimension."
    mood: love

art:
  - { rect: [0, 470, 1280, 110], color: "#24282c" }
  - { rect: [0, 0, 1280, 470], color: "#4a5056" }

hotspots:
  - id: remorque
    label: M. Remorque
    rect: [100, 130, 270, 300]
    art:
      - { rect: [110, 140, 250, 280], color: "#d9762a", stroke: "#ffffff", text: "M. REMORQUE", size: 14 }
    look: "M. Remorque, gardien de la fourrière. Long comme un jour sans navette, gilet fluo, casquette à damier trop grande, et un trousseau de petits sabots jaunes qui tinte à chaque soupir. Il me regarde comme un croque-mort regarde un client qui respire encore."
    talk:
      - dialogue: st_remorque_quai
    useItem:
      ticket_douane:
        - if: { notItems: [permis] }
          say: "remorque: Un ticket tout seul, ça ne sort pas un véhicule. Ça sort un regret. Revenez avec le permis. Je garde la place. Je garde tout, c'est mon métier."
          stop: true
        - dialogue: st_remorque_amende
          take: ticket_douane
          set: st_amende
      permis: "remorque: Joli permis. Il manque son jumeau : le ticket d'entrée. Un véhicule qui sort sans être entré, c'est un fantôme. Les fantômes, on les enlève aussi. Mais c'est plus long."
      tampon_annule:
        - if: { flags: [st_amende], notFlags: [st_vaisseau_libere] }
          say: "remorque: On ne tamponne pas le gardien. Le gardien n'est pas en infraction. L'amende est sous l'essuie-glace. C'est là qu'elle souffre."
          stop: true
        - say: "remorque: Annuler quoi ? Pas d'amende sans retrait, pas de retrait sans ticket et permis. Pour l'instant, votre capsule n'est même pas en infraction. Elle est juste triste."
      badge: "remorque: Un badge, c'est pour entrer. Ici, on ne fait que sortir. Ou rester. Surtout rester."
      fragment: "remorque: Un caillou qui brille. Si je le tamponne « ENLÈVEMENT », il disparaît ? Non ? Alors ça ne m'intéresse pas. Rangez ça."
    useItemDefault: "remorque: Je n'enlève pas ça. Je n'enlève que les véhicules. Et les espoirs."

  - id: amendes
    label: Panneau des amendes
    smart: look
    rect: [480, 60, 250, 150]
    art:
      - { rect: [485, 65, 240, 140], color: "#ffd166", stroke: "#2a2830", text: "TARIFS", size: 14 }
    look:
      - say: "« FOURRIÈRE — TARIFS. STATIONNEMENT GÊNANT : 12 DIMENSIONS. EN TRAVERS D'UNE DIMENSION : 4 096. RETRAIT : TICKET + PERMIS. »"
      - say: "En bas, en tout petit : « TOUTE AMENDE TAMPONNÉE PAR LE BUREAU DES TAMPONS FAIT FOI. » Je retiens. Je retiens tout."

  - id: capsule_vaisseau
    label: Capsule CS-07
    rect: [620, 185, 520, 300]
    art:
      - { rect: [630, 195, 500, 280], color: "#e8e8e0", stroke: "#d9762a", text: "CS-07", size: 22 }
    look:
      - if: { flags: [st_vaisseau_libere] }
        say: "La capsule CS-07, libérée. Plus de sabot. Les petites tuyères bleuissent doucement. Elle attend un permis. Elle a l'habitude d'attendre, maintenant : elle a passé la journée ici."
        stop: true
      - say: "Notre capsule, garée en travers. Un sabot jaune verrouillé sur le patin avant, une étiquette rouge : « FOURRIÈRE — RETRAIT SUR PRÉSENTATION DU TICKET D'ENTRÉE ET DU PERMIS DE LA DIRECTION »."
    use:
      - if: { flags: [st_vaisseau_libere] }
        say: "La porte s'ouvre. Le siège en carapace m'attend. Mais le tableau de bord affiche : « PERMIS DE QUITTER LA DIMENSION ? ». Il veut le voir."
        stop: true
      - say: "Je tire sur le sabot. Il ne bouge pas. Je tire sur la porte. Elle s'ouvre de deux centimètres, puis le sabot fait CLONK. Je referme."
    useItem:
      permis:
        - if: { notFlags: [st_vaisseau_libere] }
          say: "Je plaque le permis contre le hublot. Le tableau de bord s'allume : « PERMIS VALIDE ». Puis le sabot fait CLONK. « VÉHICULE IMMOBILISÉ ». Il faut d'abord régler la fourrière."
          stop: true
        - take: permis
          end: st_suite
      tampon_annule:
        - if: { flags: [st_amende], notFlags: [st_vaisseau_libere] }
          dialogue: st_remorque_annule
          set: st_vaisseau_libere
          stop: true
        - if: { flags: [st_vaisseau_libere] }
          say: "Déjà annulée. Une amende annulée deux fois redeviendrait valable. Ici, je ne prends pas le risque."
          stop: true
        - say: "Tamponner « ANNULÉ » sur la capsule ? Je ne veux pas annuler la capsule. Je veux juste partir avec."
      fragment: "L'éclat sur le tableau de bord ? Pas encore. La capsule a un sabot et une amende. L'improbabilité, ça ne règle pas une fourrière."
    useItemDefault: "La capsule ne démarre ni avec ça, ni sans permis. Elle est très stricte, pour une capsule installée par le moins-disant."

  - id: amende
    label: Amende (sur le pare-brise)
    if: { flags: [st_amende], notFlags: [st_vaisseau_libere] }
    rect: [800, 250, 130, 80]
    art:
      - { rect: [805, 255, 120, 70], color: "#ffd166", stroke: "#c0392b", text: "AMENDE", size: 12 }
    look: "L'amende, glissée sous l'essuie-glace : « 4 096 CRÉDITS — STATIONNEMENT EN TRAVERS D'UNE DIMENSION ». Je n'ai pas de crédits. Je n'ai que des objets. Et un dossier humain, ce qui ici ne vaut pas grand-chose."
    use: "Je ne vais pas payer 4 096 crédits. Je ne sais même pas ce qu'est un crédit. Ici, je doute que quelqu'un le sache."
    useItem:
      tampon_annule:
        - dialogue: st_remorque_annule
          set: st_vaisseau_libere
      permis: "Le permis ne paie pas l'amende. Il permet de partir. L'amende, elle, permet de rester. Pour toujours."
    useItemDefault: "Ça ne paie pas une amende. Ça ne l'annule pas non plus. Ici, seul ce qui est officiel compte."

  - id: bob
    label: B.O.B.
    rect: [360, 435, 150, 80]
    art:
      - { rect: [365, 450, 140, 50], color: "#7c8794", stroke: "#ffffff" }
    look: "B.O.B. tourne autour de la capsule en reniflant le sabot. Il le trouve mal entretenu. C'est la première fois qu'il critique quelque chose. Il est en train de grandir."
    talk:
      - dialogue: st_bob_fourriere
    useItemDefault:
      - say: "bob: Garde-le, Gary. On part bientôt. On aura besoin de tout. Surtout de ce qui ne sert à rien."
        mood: love

exits:
  - id: vers_sas
    label: Sas d'Arrivée
    to: st-sas
    dir: left
    rect: [10, 140, 80, 320]
