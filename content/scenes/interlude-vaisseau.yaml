# Interlude ch.0 → ch.1 : la Capsule de Service CS-07 (docs/INTERLUDE_VAISSEAU.md).
# Rendu 3D : src/three/rooms/cockpit.ts. `art:` = repli 2D.
# Ordre : siège (combi) et contact (badge) libres ; puis levier → destination → réceptacle.
# Props physiques en clic direct (docs/CHAPTERS.md §conventions) : chaque gros bouton, le levier
# et chaque destination du navigateur ont leur hotspot, aligné sur son mesh 3D — pas de menu.
id: interlude-vaisseau
title: Capsule de Service CS-07
sector: Interlude · Faille B-7 → ???
icon: console
background: "#120c1e"

onFirstEnter:
  - dialogue: iv_arrivee
# filet : rechargement après le saut (iv_saut posé) → on repart directement à la Station
onEnter:
  - if: { flags: [iv_saut] }
    card: ch1
    goto: st-sas

art:
  - { rect: [0, 0, 1280, 580], color: "#1b1430" }
  - { rect: [420, 74, 590, 132], color: "#3a1050", stroke: "#b56cff" }        # pare-brise panoramique
  - { rect: [0, 210, 1280, 190], color: "#2a3140", stroke: "#7fffd4" }        # tableau de bord
  - { text: "60 BOUTONS · 14 LEVIERS · 3 VOLANTS", at: [640, 300], size: 18, color: "#ffd166" }

hotspots:
  - id: pare_brise
    label: Pare-brise
    smart: look
    rect: [420, 74, 590, 132]
    look:
      - say: "Un pare-brise panoramique. Le seul truc bien fait de la capsule : il a dû tomber d'un autre vaisseau, et personne ne l'a réclamé."
      - say: "Derrière, le ciel intersidéral, des étoiles par milliards. Et au milieu, la faille qui ondule, violette, comme un rideau de douche cosmique."
      - if: { notFlags: [iv_destination] }
        say: "bob: On ne voit rien, Gary. C'est le principe d'une faille : on ne sait pas ce qu'il y a derrière. Comme un tiroir de bureau."
        mood: suspicious
      - if: { flags: [iv_destination] }
        say: "Au fond de la faille, des rangées de guichets à perte de vue. Ils clignotent tous en même temps. « FERMÉ »."

  - id: siege
    label: Siège-carapace
    rect: [40, 250, 240, 295]
    if: { notFlags: [iv_assis] }
    art:
      - { rect: [60, 270, 200, 255], color: "#6b3a12", stroke: "#c9a13a" }
      - { text: "SIÈGE", at: [160, 400], size: 18, color: "#ffd166" }
    look: "Un siège moulé en forme de carapace. Pour un cafard, c'est un fauteuil club. Pour moi, c'est une coquille d'œuf avec un dossier."
    use:
      - say: "narrateur: Gary essaie de s'asseoir. Le siège le recrache poliment. Il refuse tout ce qui n'a pas d'exosquelette."
      - say: "Il veut un cafard. J'ai un costume de cafard. Le règlement intérieur est clair, pour une fois."
    useItem:
      combi_chitine:
        - take: combi_chitine
        - dialogue: iv_siege
      badge: "Badger un siège ? J'ai badgé beaucoup de choses dans ma vie. Pas encore un siège. Pas aujourd'hui."
      fragment: "L'éclat sur le siège ? Il serait capable de s'asseoir à ma place. Et de mieux piloter."

  - id: tableau
    label: Tableau de bord
    sfx: click
    sfxDud: { notFlags: [iv_contact] }
    smart: look
    rect: [300, 220, 680, 150]
    look:
      - say: "Soixante boutons, quatorze leviers, trois volants. Un tableau de bord prévu pour douze, installé par le moins-disant dans une capsule pour un."
      - if: { notFlags: [iv_contact] }
        say: "Tout est éteint. À droite, une fente marquée « CONTACT ». Le reste attend qu'on le réveille."
      - if: { flags: [iv_contact], notFlags: [iv_navigateur] }
        say: "Chaque bouton a une étiquette rigolote. Sauf un levier, tout seul, tout gris. C'est toujours celui-là qu'il faut, dans les manuels."
    use:
      - if: { notFlags: [iv_contact] }
        say: "Rien. Aucune lumière. Les soixante boutons font « clic » dans le vide, comme un clavier de démonstration."
        stop: true
      - say: "Je ne vais pas m'allonger sur tout le tableau. Je vise un bouton. Un seul. Comme un professionnel."
    useItemDefault: "Je ne vais pas coincer ça entre deux boutons. Le dernier qui a fait ça, c'est le porte-gobelet, et regardez où il en est."

  # ── props physiques en clic direct : un hotspot par bouton (meshes : rooms/cockpit.ts) ──
  - id: bouton_npa
    label: Gros bouton « NE PAS APPUYER »
    sfx: click
    sfxDud: { notFlags: [iv_contact] }
    useLabel: Appuyer
    rect: [370, 262, 100, 74]
    art:
      - { circle: [420, 300, 26], color: "#ff4f5a", stroke: "#ffffff", text: "NE PAS\nAPPUYER", size: 9 }
    look: "« NE PAS APPUYER ». Un bouton rouge, rond, brillant, avec une consigne. C'est la définition exacte d'une invitation."
    use:
      - if: { notFlags: [iv_contact] }
        say: "Clic. Rien. Même les boutons interdits ont besoin de courant."
        stop: true
      - if: { flags: [iv_ascenseur] }
        say: "Je rappuie. La musique d'ascenseur ne s'arrête pas. Elle gagne juste un peu d'assurance."
        stop: true
      - dialogue: iv_btn_ascenseur
    useItemDefault: "Je ne vais pas appuyer avec ça. J'ai un doigt. Il est fait pour ça. C'est sa seule compétence reconnue."

  - id: bouton_hyper
    label: Bouton « HYPERESPACE »
    sfx: click
    sfxDud: { notFlags: [iv_contact] }
    useLabel: Appuyer
    rect: [515, 262, 100, 74]
    art:
      - { rect: [520, 280, 90, 40], color: "#3d7dd8", stroke: "#ffffff", text: "HYPER", size: 12 }
    look: "« HYPERESPACE ». Un bouton bleu, très sûr de lui. Les boutons sûrs d'eux, je m'en méfie."
    use:
      - if: { notFlags: [iv_contact] }
        say: "Clic. Rien. L'hyperespace attendra le contact, comme tout le monde."
        stop: true
      - if: { flags: [iv_hyper] }
        say: "L'allume-cigare ressort, toujours brûlant. Toujours inutile. Toujours prévu par le règlement."
        stop: true
      - dialogue: iv_btn_hyper
    useItemDefault: "Je ne vais pas appuyer avec ça. J'ai un doigt. Il est fait pour ça. C'est sa seule compétence reconnue."

  - id: bouton_eject
    label: Bouton « ÉJECTION »
    sfx: click
    sfxDud: { notFlags: [iv_contact] }
    useLabel: Appuyer
    rect: [635, 262, 100, 74]
    art:
      - { rect: [640, 280, 90, 40], color: "#ff8c42", stroke: "#ffffff", text: "ÉJECT.", size: 12 }
    look: "« ÉJECTION ». Dans une capsule d'un mètre vingt, je me demande bien ce qu'on éjecte. Moi, probablement."
    use:
      - if: { notFlags: [iv_contact] }
        say: "Clic. Rien. Heureusement, peut-être."
        stop: true
      - if: { flags: [iv_eject] }
        say: "Clic. Il n'y a plus rien à éjecter. Le bouton a l'air déçu. Moi aussi, un peu."
        stop: true
      - dialogue: iv_btn_eject
    useItemDefault: "Je ne vais pas appuyer avec ça. J'ai un doigt. Il est fait pour ça. C'est sa seule compétence reconnue."

  - id: bouton_auto
    label: Bouton « AUTOPILOTE »
    sfx: click
    sfxDud: { notFlags: [iv_contact] }
    useLabel: Appuyer
    rect: [755, 262, 100, 74]
    art:
      - { rect: [760, 280, 90, 40], color: "#7fffd4", stroke: "#ffffff", text: "AUTO", size: 12 }
    look: "« AUTOPILOTE ». Le plus beau mot du tableau de bord. Il promet que quelqu'un d'autre va s'en occuper."
    use:
      - if: { notFlags: [iv_contact] }
        say: "Clic. Rien. L'autopilote dort. Je le comprends."
        stop: true
      - if: { flags: [iv_auto] }
        say: "Le clapet se rouvre. Le post-it est toujours là : « L'autopilote, c'est vous :'( ». Il n'a pas changé d'avis."
        stop: true
      - dialogue: iv_btn_auto
    useItemDefault: "Je ne vais pas appuyer avec ça. J'ai un doigt. Il est fait pour ça. C'est sa seule compétence reconnue."

  - id: levier
    label: Levier sans étiquette
    sfx: lever
    sfxDud: { notFlags: [iv_contact] }
    useLabel: Tirer
    rect: [965, 370, 95, 110]
    art:
      - { rect: [1001, 390, 18, 80], color: "#c9ced6", stroke: "#ffffff" }
    look:
      - if: { flags: [iv_navigateur] }
        say: "Le levier gris est baissé. Il a fait son travail. Il a droit à une pause, comme tout le monde. Sauf moi."
        stop: true
      - say: "Un levier gris, sans étiquette, entre treize leviers à blagues. Il ne cherche pas à plaire. C'est louche. C'est sûrement le bon."
    use:
      - if: { notFlags: [iv_contact] }
        say: "Le levier ne bouge pas. Sans contact, même les leviers font grève."
        stop: true
      - if: { flags: [iv_navigateur] }
        say: "Il est déjà baissé. Je ne vais pas le baisser plus. Il est au bout de sa carrière."
        stop: true
      - dialogue: iv_levier
    useItemDefault: "Je ne vais pas coincer ça entre deux boutons. Le dernier qui a fait ça, c'est le porte-gobelet, et regardez où il en est."

  - id: contact
    label: Fente « CONTACT »
    rect: [1000, 250, 120, 90]
    art:
      - { rect: [1010, 270, 100, 50], color: "#14102a", stroke: "#ffd166", text: "CONTACT", size: 13 }
    look:
      - if: { notFlags: [iv_contact] }
        say: "Une fente étiquetée « CONTACT ». Elle a exactement la largeur d'un badge. Et l'air d'en attendre un depuis longtemps."
        stop: true
      - say: "Mon badge est dans la fente. L'écran me dit toujours « BONJOUR, GARRY ». Il le dira jusqu'à la fin des temps."
    use:
      - if: { notFlags: [iv_contact] }
        say: "Je mets le doigt dedans ? Non. On ne met jamais le doigt dans une fente de contact. Règlement n°2."
        stop: true
      - say: "Je laisse le badge. Si je l'enlève, tout s'éteint et le volant boude."
    useItem:
      badge:
        - if: { flags: [iv_contact] }
          say: "Il est déjà dedans. Il a l'air bien. Il a trouvé sa place, lui."
          stop: true
        - dialogue: iv_contact
      fragment: "L'éclat dans la fente « CONTACT » ? Ça ferait contact, oui. Avec tout l'univers. En même temps."
      combi_chitine: "La combi ne rentre pas dans la fente. Rien de ce qui a des antennes ne rentre dans une fente. C'est une loi de la nature."

  - id: navigateur
    label: Navigateur dimensionnel
    sfx: beep
    sfxDud: { flags: [iv_destination] }
    smart: look
    rect: [1042, 56, 216, 190]
    if: { flags: [iv_navigateur] }
    art:
      - { rect: [1049, 63, 202, 176], color: "#0e2a2a", stroke: "#7fffd4", text: "DESTINATION ?", size: 15 }
    look:
      - say: "« NAVIGATEUR DIMENSIONNEL ». Quatre destinations. L'écran a un fond d'écran : une plage. Il n'y a pas de plage dans le multivers. J'ai vérifié."
      - if: { flags: [iv_destination] }
        say: "« STATION (BUREAUCRATIQUE) — DESTINATION ACCEPTÉE ». En dessous : « TEMPS D'ATTENTE ESTIMÉ : OUI »."
    use:
      - if: { flags: [iv_destination] }
        say: "La destination est verrouillée. Pour la changer, il faut un formulaire. Évidemment."
        stop: true
      - say: "C'est tactile. Je touche la destination qui me plaît. Enfin, celle qui voudra bien de moi."

  # ── une ligne tactile par destination (rooms/cockpit.ts) ──
  - id: dest_miniature
    label: « DIMENSION MINIATURE »
    sfx: beep
    sfxDud: { flags: [iv_destination] }
    useLabel: Choisir
    rect: [1047, 88, 204, 36]
    if: { flags: [iv_navigateur] }
    look: "« DIMENSION MINIATURE ». Grisée. Tout est minuscule là-bas, paraît-il. Sauf la paperasse."
    use:
      - if: { flags: [iv_destination] }
        say: "La destination est verrouillée. Pour la changer, il faut un formulaire. Évidemment."
        stop: true
      - if: { flags: [iv_refus_miniature] }
        say: "sylvie: ACCÈS TOUJOURS REFUSÉ. LE FORMULAIRE MANQUE TOUJOURS. C'EST CONSTANT, AU MOINS."
        mood: suspicious
        stop: true
      - dialogue: iv_dest_miniature

  - id: dest_klepsydra
    label: « KLEPSYDRA-LUX »
    sfx: beep
    sfxDud: { flags: [iv_destination] }
    useLabel: Choisir
    rect: [1047, 126, 204, 36]
    if: { flags: [iv_navigateur] }
    look: "« KLEPSYDRA-LUX ». Grisée. Une version de luxe de ma station. Avec, j'imagine, un placard à balais plus grand."
    use:
      - if: { flags: [iv_destination] }
        say: "La destination est verrouillée. Pour la changer, il faut un formulaire. Évidemment."
        stop: true
      - if: { flags: [iv_refus_klepsydra] }
        say: "sylvie: TOUJOURS PAS CAPITAINE. ...PAS ENCORE."
        mood: love
        stop: true
      - dialogue: iv_dest_klepsydra

  - id: dest_yaourt
    label: « L'ENVERS DU YAOURT »
    sfx: beep
    sfxDud: { flags: [iv_destination] }
    useLabel: Choisir
    rect: [1047, 164, 204, 36]
    if: { flags: [iv_navigateur] }
    look: "« L'ENVERS DU YAOURT ». Grisée, et un peu humide. Je préfère ne pas toucher. Enfin, je préfère, mais je vais toucher."
    use:
      - if: { flags: [iv_destination] }
        say: "La destination est verrouillée. Pour la changer, il faut un formulaire. Évidemment."
        stop: true
      - if: { flags: [iv_refus_yaourt] }
        say: "bob: Gary. J'ai dit non. Mon non a des roulettes, mais c'est un non."
        mood: surprised
        stop: true
      - dialogue: iv_dest_yaourt

  - id: dest_station
    label: « STATION (BUREAUCRATIQUE) »
    sfx: beep
    sfxDud: { flags: [iv_destination] }
    useLabel: Choisir
    rect: [1047, 202, 204, 36]
    if: { flags: [iv_navigateur] }
    look: "« STATION (BUREAUCRATIQUE) ». La seule qui clignote. L'air de dire « moi, je ne juge pas »."
    use:
      - if: { flags: [iv_destination] }
        say: "La destination est verrouillée. Pour la changer, il faut un formulaire. Évidemment."
        stop: true
      - dialogue: iv_dest_station

  - id: reacteur
    label: Réceptacle « IMPROBABILITÉ (OPTIONNEL) »
    rect: [560, 380, 160, 100]
    if: { flags: [iv_destination] }
    art:
      - { circle: [640, 430, 40], color: "#b56cff", alpha: 0.5, stroke: "#ffffff" }
      - { text: "IMPROBABILITÉ\n(OPTIONNEL)", at: [640, 470], size: 11, color: "#ffffff" }
    look: "Un petit réceptacle rond, étiqueté « IMPROBABILITÉ (OPTIONNEL) ». Il a exactement la forme d'un éclat de réacteur. Quelle coïncidence improbable."
    use: "Il est vide. Il lui faut de l'improbabilité. J'en connais une, tiède, dans ma poche."
    useItem:
      fragment:
        - if: { notFlags: [iv_assis] }
          say: "bob: Pas debout, Gary ! On saute dans une faille, pas dans un bus. Assieds-toi d'abord. Dans le siège. Avec la combi."
          mood: surprised
          stop: true
        - dialogue: iv_saut
        - card: ch1
        - goto: st-sas
      badge: "Le badge est déjà au contact. Il ne peut pas être partout. Moi non plus, d'ailleurs, ça me repose."

  - id: bob
    label: B.O.B.
    rect: [760, 370, 210, 150]
    art:
      - { rect: [780, 420, 170, 60], color: "#7c8794", stroke: "#ffffff" }
      - { circle: [830, 445, 7], color: "#ffffff" }
      - { circle: [900, 445, 7], color: "#ffffff" }
    look: "B.O.B., sur mes genoux. Le porte-gobelet sur la tête. Il ne l'enlève pas. Il dit que ça lui fait un chapeau."
    talk:
      - dialogue: iv_bob
    useItemDefault:
      - say: "bob: Garde ça, Gary. Ici, j'ai un chapeau et un pilote. Je n'ai besoin de rien d'autre."
        mood: love

  # flag persistant `iv_vu` (Session) : l'interlude déjà vu peut se passer
  - id: passer
    label: Passer l'interlude
    useLabel: Passer
    rect: [1110, 500, 160, 70]
    if: { flags: [iv_vu], notFlags: [iv_saut] }
    art:
      - { rect: [1120, 510, 140, 50], color: "#14102a", stroke: "#7fffd4", text: "PASSER ▸▸", size: 16 }
    look: "J'ai déjà fait ce vol. Je connais les boutons. Je connais le yaourt. Je peux sauter directement."
    use:
      - take: combi_chitine
      - set: combi_portee
      - set: iv_assis
      - set: iv_contact
      - set: iv_navigateur
      - set: iv_destination
      - set: iv_saut
      - card: ch1
      - goto: st-sas
