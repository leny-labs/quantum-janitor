# Chapitre 1 « La Station Bureaucratique » — 6. Bureau des Tampons (docs/CHAPTER1.md §4, §6.15–16, §6.21).
# Rendu 3D : src/three/rooms/station.ts (stTampons). `art:` = repli 2D.
# Mme Gisèle Tamponnet (GenAI, planche repos / CLONK) devant le mur des 412 tampons ; encreur sec.
#   parler à Tamponnet          → plus d'encre « depuis la grève », tampon ANNULÉ    [st_tamponnet] +tampon_annule
#   prendre l'encreur sec       →                                                    [st_encreur_pris] +encreur
#   formulaire sur Tamponnet    → « PAS D'ENCRE, PAS DE VU » : la grève (teaser Acte III) [st_sait_greve]
# Acte III : encreur imbibé de café sur Tamponnet → l'encre revient     [st_tamponnet_encre] −encreur
#            formulaire sur Tamponnet (case A + encre) → « VU »          [st_case_b]
id: st-tampons
title: Bureau des Tampons
sector: Station Bureaucratique · Niveau 0 · Aile B
icon: corridor
background: "#1e2a2a"

onFirstEnter:
  - say: "Le Bureau des Tampons. Un mur entier de tampons, rangés sur des crochets. Des centaines. Ils ont tous l'air d'attendre leur tour."
  - say: "narrateur: Derrière le comptoir, une dame aux cheveux roux tamponne le vide. CLONK. Elle regarde la feuille qui n'existe pas. CLONK."
  - say: "bob: Elle tamponne sans encre, Gary. C'est le métier le plus pur que j'aie jamais vu."
    mood: love

art:
  - { rect: [0, 470, 1280, 110], color: "#2a3434" }
  - { rect: [0, 0, 1280, 470], color: "#8aa0a0" }

hotspots:
  - id: mur_tampons
    label: Mur des tampons
    rect: [150, 25, 980, 135]
    art:
      - { rect: [155, 30, 970, 125], color: "#6a4a2a", stroke: "#2a2830", text: "412 TAMPONS", size: 16 }
    look:
      - say: "Le mur des tampons. Quatre cent douze, classés par humeur : « VU », « VU MAIS », « VU EN PASSANT », « REFUSÉ », « REFUSÉ AVEC REGRET », « REFUSÉ SANS REGRET »…"
      - say: "Au milieu, un tampon rouge, seul sur son crochet. Étiquette : « ANNULÉ — NE SERT JAMAIS ». Il a l'air de s'ennuyer depuis quarante et un ans."
        if: { notFlags: [st_tamponnet] }
      - say: "Un crochet est vide, au milieu : « ANNULÉ — NE SERT JAMAIS ». Il est dans ma poche. Il sert à quelque chose, maintenant. Il ne le sait pas encore."
        if: { flags: [st_tamponnet] }
    use:
      - say: "Je décroche un tampon au hasard : « VU EN RÊVE ». Je le raccroche. On ne joue pas avec l'humeur des gens."
      - say: "tamponnet: CLONK ! Pas touche ! CLONK. Chacun son crochet."
    useItem:
      tampon_annule: "Le raccrocher ? Il vient de sortir pour la première fois depuis quarante et un ans. Laissons-lui un peu d'air."
      fragment: "L'éclat devant le mur ? Les tampons risquent de s'aligner en phrase. Et je n'ai pas envie de savoir ce qu'ils pensent."

  - id: tamponnet
    label: Mme Tamponnet
    rect: [490, 120, 290, 250]
    art:
      - { rect: [510, 170, 250, 190], color: "#1f5f5a", stroke: "#2a2830", text: "MME TAMPONNET", size: 16 }
    look:
      - say: "Une dame ronde en blouse vert canard, des cheveux roux frisés, un crayon planté dedans. Lunettes à chaînette. Des taches violettes sur les doigts, sur la joue. Des taches de souvenir."
      - say: "Elle tient un gros tampon en bois et l'abat régulièrement sur le comptoir, à vide. CLONK. Elle sourit à chaque fois."
    use:
      - say: "Je tends la main pour lui dire bonjour."
      - say: "narrateur: CLONK. Mme Tamponnet tamponne la main de Gary. Rien ne s'imprime. Elle a l'air un peu triste."
      - say: "tamponnet: CLONK. Bonjour. CLONK. Il y a quarante et un ans, vous seriez reparti « VU ». Aujourd'hui, vous repartez… comme vous êtes venu."
    talk:
      - dialogue: st_tamponnet
    useItem:
      formulaire:
        - if: { flags: [st_case_b] }
          say: "tamponnet: Déjà VU ! CLONK. Je ne tamponne pas deux fois la même case. Enfin si, mais seulement pour le plaisir. Pas sur un dossier officiel."
          stop: true
        # étape 29 (Acte III) : encre au café + case A → « VU »
        - if: { flags: [st_tamponnet_encre, st_case_a] }
          dialogue: st_tamponnet_vu
          set: st_case_b
          stop: true
        # étape 21 (teaser Acte III) : avec la case A, le « VU » bute sur l'encre → la grève
        - if: { flags: [st_case_a] }
          dialogue: st_tamponnet_formulaire
          set: st_sait_greve
          stop: true
        - dialogue: st_tamponnet_formulaire
      encreur:
        # étape 29 : l'encreur imbibé de café (combinaison encreur + gobelet) lui rend l'encre
        - if: { flags: [st_encreur_cafe] }
          dialogue: st_tamponnet_encre
          take: encreur
          set: st_tamponnet_encre
          stop: true
        - say: "tamponnet: CLONK ? Il est sec, mon petit. Sec comme un règlement intérieur. CLONK."
          mood: sad
        - say: "tamponnet: L'encre, c'était le café. Pas de café, pas d'encre. Il faudrait l'imbiber de quelque chose de chaud et de syndiqué."
      tampon_annule:
        - say: "tamponnet: Gardez-le ! CLONK. Je vous l'ai donné. Ici, on ne reprend jamais rien. On n'annule jamais rien. CLONK."
      badge: "tamponnet: CLONK ! Un badge ! Ça se tamponne très bien, un badge. Avec de l'encre. CLONK."
      copies_dossier: "tamponnet: Des copies ! « CONFORME » ! C'est M. Duplicata, ça. Il lèche ses tampons au café, lui. Le chanceux. CLONK."
      plante: "tamponnet: Oh ! M. Ficus ! Il siégeait au Conseil, avant le déménagement. CLONK. On ne le tamponne pas, il est en plastique. Ça glisse."
      fragment: "tamponnet: Ça brille ! CLONK. Ça ne se tamponne pas, ça brille. Je ne tamponne que ce qui est mat."
      liasse: "tamponnet: Des réclamations vierges ! CLONK CLONK. Je les tamponnerais toutes, si j'avais de l'encre."
    useItemDefault: "tamponnet: CLONK. Je tamponne tout ce qu'on me tend. CLONK. Mais sans encre, ça ne laisse que de l'espoir."

  - id: encreur
    label: Encreur sec
    useLabel: Prendre
    if: { notFlags: [st_encreur_pris] }
    rect: [820, 320, 120, 55]
    art:
      - { rect: [825, 330, 110, 40], color: "#5a4a6a", stroke: "#2a2830", text: "ENCREUR", size: 12 }
    look:
      - say: "Un encreur en fer-blanc, couvercle ouvert. Le feutre est sec, craquelé, couleur lilas fatigué. Une étiquette : « ENCRE OFFICIELLE — VOIR DÉLÉGUÉ DU PERSONNEL »."
    use:
      - say: "tamponnet: Prenez-le, prenez-le ! CLONK. Il ne me sert plus à rien. Si un jour vous trouvez de l'encre… vous savez où me trouver. Là. Toujours là."
      - say: "J'empoche l'encreur sec. Il est léger comme une promesse non tenue."
        give: encreur
        set: st_encreur_pris

  - id: panneau
    label: Plaque « BUREAU DES TAMPONS »
    smart: look
    rect: [140, 190, 220, 120]
    art:
      - { rect: [145, 195, 210, 110], color: "#1f5f5a", stroke: "#f6efdc", text: "TAMPONS", size: 16 }
    look:
      - say: "« BUREAU DES TAMPONS ». Dessous, un horaire : « TAMPONNAGE : EN CONTINU. ENCRAGE : SUSPENDU (PRÉAVIS DU 10/11) »."
      - say: "bob: Suspendu par préavis. Il y a une grève quelque part, Gary. Et elle a pris l'encre en otage."
        mood: suspicious

  - id: bob
    label: B.O.B.
    # bien devant le comptoir (pied à y = 530) : sa silhouette ne mord plus sur le bas du
    # comptoir, il ne se lit plus « dedans » ni « derrière »
    rect: [610, 450, 150, 80]
    art:
      - { rect: [615, 465, 140, 50], color: "#7c8794", stroke: "#ffffff" }
    look: "B.O.B. sursaute à chaque CLONK. Il fait semblant de ne pas sursauter. Il sursaute quand même."
    talk:
      - dialogue: st_bob_tampons
    useItem:
      tampon_annule: "bob: Ne m'annule pas, Gary. J'ai mis des années à exister à peu près."
      encreur: "bob: Il est sec, Gary. Je le sens d'ici. Je suis un aspirateur : je sais reconnaître la poussière quand elle est triste."
    useItemDefault:
      - say: "bob: Pas à moi, Gary. Je ne tamponne rien. Je suis à peine validé."
        mood: sad

exits:
  - id: vers_couloir
    label: Couloir Infini B
    to: st-couloir-b
    dir: left
    rect: [10, 140, 100, 320]
