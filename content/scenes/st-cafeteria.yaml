# Chapitre 1 « La Station Bureaucratique » — Cafétéria d'accueil (docs/CHAPTER1.md §4, lieu 2 bis).
# Rendu 3D : src/three/rooms/station.ts (stCafeteria). `art:` = repli 2D.
# Scaffold (pas de puzzle) : lieu d'ambiance, porte au fond de la Salle d'Attente. Distinct de
# `st-pause` (Salle de Pause / grève de PERCO, aile B). Lore : d'où vient le sandwich de
# Mme Guichard depuis 41 ans (sandwich consigné, rendu le soir, revendu le lendemain).
id: st-cafeteria
title: Cafétéria
sector: Station Bureaucratique · Niveau 0 · Restauration administrative
icon: corridor
background: "#2e2a24"

onFirstEnter:
  - say: "Une cafétéria. Des néons, des plateaux, une odeur de café froid et de règlement. C'est exactement comme la cantine de l'entretien, sauf qu'ici, personne ne mange. On attend de manger."

art:
  - { rect: [0, 470, 1280, 110], color: "#4a3e30" }
  - { rect: [0, 0, 1280, 470], color: "#c9bb94" }

hotspots:
  # `smart: look` : clic gauche = Regarder = travel d'examen (stCafeteria.shots) ; les gags
  # « Utiliser » (cloche, expresso, chaise…) restent au verb coin.
  - id: menu
    label: Panneau « PLAT DU JOUR »
    smart: look
    rect: [690, 70, 220, 165]
    art:
      - { rect: [700, 80, 200, 145], color: "#1a1a1a", stroke: "#c9ced6", text: "PLAT DU JOUR\nLE MÊME", size: 18 }
    look:
      - say: "« PLAT DU JOUR : LE MÊME. PRIX : LE MÊME ». Les lettres sont enfoncées si profond dans le feutre qu'on ne pourrait plus les changer. Personne n'a essayé."
      - say: "Le « Ê » de « MÊME » est un peu de travers. C'est la seule chose qui a bougé ici depuis l'inauguration."
    use: "Je pourrais réarranger les lettres. « LE MÊME » → « MÉLÈME ». Non. On ne joue pas au Scrabble avec un menu administratif. On finit au Bureau des Tampons."
    useItem:
      fragment: "L'éclat sur le menu ? Le plat du jour deviendrait « UN AUTRE ». La Station ne s'en remettrait pas."

  - id: vitrine
    label: Vitrine à sandwichs
    smart: look
    rect: [330, 235, 280, 230]
    art:
      - { rect: [340, 300, 260, 160], color: "#bfe6ff", stroke: "#8d93a0", text: "SANDWICHS", size: 14 }
    look:
      - say: "Une vitrine réfrigérée. Trois sandwichs jambon-beurre, sous film. Le pain a la couleur et la souplesse d'une dalle de béton. La salade est devenue un concept."
      - say: "Étiquette : « SANDWICH CONSIGNÉ — À RAPPORTER EN FIN DE SERVICE. REMIS EN VENTE LE LENDEMAIN. » En dessous, une fiche : « COMMANDE PERMANENTE N° 1 — Mme O. GUICHARD — RECONDUCTION TACITE »."
      - say: "Donc c'est ça. Le même sandwich depuis quarante et un ans. Elle l'achète le matin, le rapporte le soir, le rachète le lendemain. Ce n'est pas un repas. C'est un abonnement."
    use: "narrateur: Gary tire sur la porte vitrée. Elle est scellée par un plomb et une étiquette : « NE PAS OUVRIR AVANT LE RÉAPPROVISIONNEMENT ». Le dernier réapprovisionnement date d'avant le plomb."
    talk: "Courage, les gars. Quelqu'un finira par vous manger. Ou par vous classer aux Archives. Les deux se valent, ici."
    useItem:
      ticket_douane: "« TICKET NON VALABLE EN RESTAURATION ». Évidemment. Il faudrait un ticket-repas. Qu'on obtient sans doute au guichet. Contre un ticket."
      ticket_9848: "Le 9 848 de M. Patience ? Non. Ce ticket est pour le guichet. On ne mange pas le ticket d'un mort. Même ici."
      fragment: "Si je pose l'éclat sur la vitrine, les sandwichs pourraient redevenir frais. Ou se mettre à parler. Je ne veux entendre ni l'un ni l'autre."

  # zooms examine sur la vitrine (après `vitrine` : zones plus petites, prioritaires au clic)
  - id: reserve
    label: Carton « RÉSERVÉ MME G. »
    smart: look
    rect: [488, 270, 84, 34]
    look:
      - say: "Une place vide sur l'étagère du haut, et un carton plié : « RÉSERVÉ MME G. ». Écrit au feutre, repassé au feutre, repassé encore. Le carton a plus de couches d'encre que de carton."
      - say: "Même le vide a une commande permanente, ici. Le sandwich est sorti ce matin. Il reviendra ce soir. Comme tous les soirs depuis quarante et un ans."
    use: "Je ne touche pas au carton. Quarante et un ans de reconduction tacite, ça se respecte. Et ça se tamponne, sûrement."
    useItem:
      fragment: "Poser l'éclat à la place du sandwich de Mme Guichard ? Elle le mangerait sans voir la différence. C'est bien ça qui m'inquiète."

  - id: plomb
    label: Plomb « NE PAS OUVRIR »
    smart: look
    rect: [484, 324, 106, 34]
    look:
      - say: "Un bandeau rouge et un plomb de scellé : « NE PAS OUVRIR AVANT LE RÉAPPROVISIONNEMENT ». Le plomb porte un tampon : « 10/11/1985 — 10 H 11 »."
      - say: "Il a plus d'ancienneté que moi. Il aura sans doute une meilleure retraite."
    use: "narrateur: Gary tire doucement sur le bandeau. Le plomb ne bouge pas. Quelque part dans la Station, un tampon se lève, prêt à frapper."

  - id: comptoir
    label: Comptoir
    smart: look
    rect: [615, 255, 320, 215]
    art:
      - { rect: [625, 330, 300, 130], color: "#6d5a48", stroke: "#4a3a2c", text: "CAISSE", size: 16 }
    look:
      - say: "Le comptoir. Une caisse enregistreuse à manivelle, une cloche « SONNEZ », une pile de plateaux beiges. Un écriteau : « CAISSE OUVERTE DE 10 H 12 À 10 H 14 »."
      - say: "Les mêmes horaires que le guichet. C'est sûrement la même personne. Elle court beaucoup, pendant ces deux minutes."
    use:
      - say: "narrateur: Gary sonne la cloche. DING. Le son traverse la cafétéria, la salle d'attente, et s'éteint quelque part du côté du guichet."
      - say: "Personne. Je crois qu'on vient d'ajouter mon passage dans un registre. Cafétéria, 1 visiteur, 0 repas servi. Statistiques excellentes."
    talk: "Il y a quelqu'un ? ...La caisse fait « tchac » toute seule, par politesse. Le tiroir s'ouvre, il contient un trombone et un mot : « REVENEZ À 10 H 12 »."
    useItem:
      badge: "« GARRY PLUNK ». La caisse ne lit pas les badges. Elle ne lit rien, en fait. C'est une caisse à manivelle."
      plante: "Je pose M. Ficus sur le comptoir, pour voir. Il fait plus client que moi. Mais il n'a pas faim non plus."

  - id: cafe
    label: Machine à café « PERCO-JUNIOR »
    smart: look
    sfx: clonk
    rect: [960, 140, 140, 325]
    art:
      - { rect: [970, 150, 120, 305], color: "#3a3f4a", stroke: "#ffd166", text: "CAFÉ", size: 16 }
    look:
      - say: "Une petite machine à café, plaque « PERCO-JUNIOR — SERVICE MINIMUM ». Écran : « SOLIDAIRE DU MOUVEMENT. CAFÉ : NON. EAU CHAUDE : ÉVENTUELLEMENT »."
      - say: "Le grand PERCO doit être quelque part dans la Station, en grève. Le petit fait comme lui. Avec moins de conviction, et plus de vapeur."
    use:
      - say: "narrateur: Gary appuie sur « EXPRESSO ». PERCO-JUNIOR glougloute, siffle, et sert un gobelet d'eau tiède. Puis, par principe, il le reprend."
      - say: "Service minimum. On a eu le service. On n'a pas eu le minimum."
    talk: "Salut, petit. Tu fais grève aussi ? ...Écran : « JE NE FAIS PAS GRÈVE. JE SOUTIENS. C'EST DIFFÉRENT. ÇA COÛTE MOINS CHER »."
    useItem:
      fragment: "Un expresso à l'improbabilité ? Il sortirait du thé. Ou un ours. Je ne prends pas le risque avant mon café. Je n'ai pas de café."
      ticket_douane: "La fente à pièces refuse le ticket. Elle refuse aussi les pièces, en fait. Solidarité."

  - id: tables
    label: Tables
    smart: look
    rect: [1105, 300, 165, 200]
    art:
      - { rect: [1115, 380, 145, 20], color: "#d8d2c0" }
      - { rect: [1180, 400, 15, 90], color: "#8d93a0" }
    look:
      - say: "Des tables rondes, vissées au sol, comme les chaises de la salle d'attente. Sur l'une, un plateau abandonné : un gobelet vide, une serviette pliée en formulaire, et un ticket de caisse de 1985."
      - say: "Le montant total est « LE MÊME ». La TVA aussi."
    use: "narrateur: Gary s'assoit une seconde. La chaise grince, puis affiche sur un petit écran : « TEMPS D'ATTENTE ESTIMÉ AVANT SERVICE : 41 ANS »."

  - id: bob
    label: B.O.B.
    # à gauche, devant la vitrine : yeux au-dessus du HUD (docs/CHAPTERS.md)
    rect: [130, 415, 150, 80]
    art:
      - { rect: [135, 430, 140, 50], color: "#7c8794", stroke: "#ffffff" }
    look: "B.O.B. tient ma laisse et regarde la vitrine. Il a l'air ému. Les miettes, c'est sa famille."
    talk:
      - say: "bob: Ces sandwichs ont vu passer plus de directeurs que de clients. Je les respecte. Je ne les aspirerai pas. Pas aujourd'hui."
      - say: "bob: Le guichet est par là, Gary. Retourne dans la salle d'attente. Ici, la seule chose qui avance, c'est la date de péremption."
    useItem:
      fragment: "bob: Garde l'éclat dans ta poche. Une cafétéria improbable, c'est une cafétéria qui sert à manger. Ce serait du désordre."
    useItemDefault:
      - say: "bob: Je ne suis pas un plateau, Gary. Enfin. Pas officiellement."
        mood: sad

exits:
  - id: vers_attente
    label: Salle d'Attente
    to: st-attente
    dir: left
    rect: [10, 140, 100, 320]
